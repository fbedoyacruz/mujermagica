    function setPosTab(tab) {
      if (!["productos", "servicios", "mayorista"].includes(tab)) return;
      appState.posTab = tab;
      renderView();
      if (tab !== "servicios") focusBarcodeScanner();
    }

    function setHistoryMode(mode) {
      if (!["all", "date"].includes(mode)) return;
      appState.historyMode = mode;
      renderView();
    }

    function setHistoryDate(date) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
      appState.historyDate = date;
      renderView();
    }

    function renderVentas(st, search = "") {
      const criteria = search.toLowerCase();
      const filtered = st.sales.filter(s => {
        const matchesTicket = !criteria || s.id.toLowerCase().includes(criteria);
        const matchesDate = appState.historyMode !== "date" || getLocalDateInputValue(s.fecha) === appState.historyDate;
        return matchesTicket && matchesDate;
      });
      const rows = [...filtered].sort((a, b) => new Date(b.fecha) - new Date(a.fecha)).map(s => {
        const customer = s.clienteId ? st.customers.find(c => c.id === s.clienteId) : null;
        return `<tr class="border-b text-sm"><td class="px-3 py-2">${escapeHtml(s.id)}</td><td class="px-3 py-2">${formatDate(s.fecha)}</td><td class="px-3 py-2">${escapeHtml(customer?.nombre || "Contado")}</td><td class="px-3 py-2 text-right">${s.items.length}</td><td class="px-3 py-2 text-right font-semibold">${formatCurrency(s.total)}</td><td class="px-3 py-2 text-center"><button onclick="verFactura('${escapeHtml(s.id)}')" class="text-slate-600 hover:text-slate-900 text-sm">Ver</button></td><td class="px-3 py-2 text-center"><button type="button" onclick="eliminarVenta('${escapeHtml(s.id)}')" class="text-sm font-semibold text-red-700">Eliminar</button></td></tr>`;
      }).join("");
      const emptyMessage = appState.historyMode === "date" ? "No hay ventas para la fecha seleccionada." : "No hay ventas registradas.";
      const tableRows = rows || `<tr><td colspan="6" class="px-3 py-6 text-center text-sm text-slate-500">${emptyMessage}</td></tr>`;
      const dailyInvoiced = filtered.reduce((sum, sale) => sum + Number(sale.total || 0), 0);
      const dailyEntityFees = filtered.reduce((sum, sale) => sum + Number(sale.comisionEntidadValor ?? (sale.metodoPago === "QR" ? sale.comisionValor : 0) ?? 0), 0);
      const dailyNetReceived = filtered.reduce((sum, sale) => sum + Number(sale.netoRecibido ?? sale.total ?? 0), 0);
      const dailySummary = appState.historyMode === "date"
        ? `<div class="grid grid-cols-2 gap-3 mb-4 md:grid-cols-4"><div class="rounded-lg bg-slate-50 p-3"><p class="text-xs text-slate-500">Ventas del día</p><p class="mt-1 text-lg font-bold">${filtered.length}</p></div><div class="rounded-lg bg-slate-50 p-3"><p class="text-xs text-slate-500">Total facturado</p><p class="mt-1 text-lg font-bold">${formatCurrency(dailyInvoiced)}</p></div><div class="rounded-lg bg-slate-50 p-3"><p class="text-xs text-slate-500">Comisiones bancarias / plataforma</p><p class="mt-1 text-lg font-bold">${formatCurrency(dailyEntityFees)}</p></div><div class="rounded-lg bg-teal-50 p-3"><p class="text-xs text-slate-600">Neto recibido para caja</p><p class="mt-1 text-lg font-bold text-teal-900">${formatCurrency(dailyNetReceived)}</p></div></div>`
        : "";
      const dateFilter = appState.historyMode === "date"
        ? `<div><label for="historyDate" class="mb-1 block text-sm font-semibold">Fecha</label><input id="historyDate" type="date" value="${appState.historyDate}" onchange="setHistoryDate(this.value)" class="w-full rounded-lg border bg-white px-3 py-2 text-sm sm:w-56" /></div>`
        : "";
      return `<div class="view-card"><h3 class="text-lg font-bold mb-4">💳 Historial de ventas</h3><div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between"><div><label for="historyMode" class="mb-1 block text-sm font-semibold">Consultar</label><select id="historyMode" onchange="setHistoryMode(this.value)" class="w-full rounded-lg border bg-white px-3 py-2 text-sm sm:w-56"><option value="all" ${appState.historyMode === "all" ? "selected" : ""}>Todo el historial</option><option value="date" ${appState.historyMode === "date" ? "selected" : ""}>Por fecha</option></select></div>${dateFilter}</div>${dailySummary}<div class="overflow-x-auto rounded-xl border bg-white"><table class="min-w-full text-sm"><thead class="bg-slate-50 text-xs uppercase border-b"><tr><th class="px-3 py-2 text-left">Ticket</th><th class="px-3 py-2 text-left">Fecha</th><th class="px-3 py-2 text-left">Cliente</th><th class="px-3 py-2">Items</th><th class="px-3 py-2 text-right">Total</th><th class="px-3 py-2">Factura</th><th class="px-3 py-2">Acción</th></tr></thead><tbody>${tableRows}</tbody></table></div></div>`;
    }

    function getCreditPaid(creditId, state = db) {
      return (state.customerPayments || []).filter(payment => payment.creditId === creditId).reduce((total, payment) => total + Number(payment.monto || 0), 0);
    }

    function getCreditBalance(credit, state = db) {
      return Math.max(0, Number((Number(credit.monto) - getCreditPaid(credit.id, state)).toFixed(2)));
    }

    function setCarteraCustomer(customerId) {
      appState.carteraCustomerId = customerId || "";
      renderView();
    }

    function renderCartera(st, search = "") {
      const criteria = search.trim().toLowerCase();
      const selectedCustomerId = appState.carteraCustomerId;
      const credits = (st.customerCredits || []).map(credit => {
        const customer = st.customers.find(entry => entry.id === credit.customerId);
        const sale = st.sales.find(entry => entry.id === credit.saleId);
        return { ...credit, customer, sale, abonado: getCreditPaid(credit.id, st), saldo: getCreditBalance(credit, st) };
      }).filter(credit => {
        if (!credit.customer || (selectedCustomerId && credit.customerId !== selectedCustomerId)) return false;
        const searchable = `${credit.customer.nombre} ${credit.customer.documento || ""} ${credit.saleId}`.toLowerCase();
        return !criteria || searchable.includes(criteria);
      }).sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

      const totalCartera = (st.customerCredits || []).reduce((total, credit) => total + getCreditBalance(credit, st), 0);
      const customerIdsWithBalance = new Set((st.customerCredits || []).filter(credit => getCreditBalance(credit, st) > 0).map(credit => credit.customerId));
      const totalAbonos = (st.customerPayments || []).reduce((total, payment) => total + Number(payment.monto || 0), 0);
      const customerOptions = [
        `<option value="" ${!selectedCustomerId ? "selected" : ""}>Todos los clientes</option>`,
        ...st.customers.map(customer => `<option value="${escapeHtml(customer.id)}" ${customer.id === selectedCustomerId ? "selected" : ""}>${escapeHtml(customer.nombre)} · ${escapeHtml(customer.documento || "Sin documento")}</option>`)
      ].join("");

      const creditRows = credits.map(credit => `<tr class="border-b text-sm"><td class="px-3 py-2">${formatDate(credit.fecha)}</td><td class="px-3 py-2 font-semibold">${escapeHtml(credit.customer.nombre)}</td><td class="px-3 py-2"><button type="button" onclick="verFactura('${escapeHtml(credit.saleId)}')" class="font-semibold text-teal-700">${escapeHtml(credit.saleId)}</button></td><td class="px-3 py-2 text-right">${formatCurrency(credit.monto)}</td><td class="px-3 py-2 text-right">${formatCurrency(credit.abonado)}</td><td class="px-3 py-2 text-right font-semibold">${formatCurrency(credit.saldo)}</td><td class="px-3 py-2 text-center">${credit.saldo > 0 ? `<button type="button" onclick="showCreditPaymentModal('${escapeHtml(credit.id)}')" class="rounded-md bg-teal-700 px-3 py-1.5 text-xs font-semibold text-white">Registrar abono</button>` : '<span class="text-xs font-semibold text-emerald-700">Pagado</span>'}</td></tr>`).join("");
      const visibleCreditIds = new Set(credits.map(credit => credit.id));
      const paymentRows = (st.customerPayments || []).filter(payment => visibleCreditIds.has(payment.creditId)).sort((a, b) => new Date(b.fecha) - new Date(a.fecha)).map(payment => {
        const credit = credits.find(entry => entry.id === payment.creditId);
        return `<tr class="border-b text-sm"><td class="px-3 py-2">${formatDate(payment.fecha)}</td><td class="px-3 py-2 font-semibold">${escapeHtml(credit?.customer.nombre || "Cliente")}</td><td class="px-3 py-2">${escapeHtml(credit?.saleId || "-")}</td><td class="px-3 py-2 text-right font-semibold">${formatCurrency(payment.monto)}</td><td class="px-3 py-2">${escapeHtml(payment.metodoPago || "-")}</td><td class="px-3 py-2">${escapeHtml(payment.observaciones || "-")}</td></tr>`;
      }).join("");

      return `<div class="space-y-4"><div class="view-card"><div class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between"><div><h2 class="text-lg font-bold">Cartera de clientes</h2><p class="text-sm text-slate-500">Créditos pendientes y abonos registrados</p></div><div><label for="carteraCustomer" class="mb-1 block text-sm font-semibold">Cliente</label><select id="carteraCustomer" onchange="setCarteraCustomer(this.value)" class="w-full rounded-lg border bg-white px-3 py-2 text-sm sm:w-72">${customerOptions}</select></div></div></div><div class="grid grid-cols-1 gap-3 sm:grid-cols-3"><div class="kpi-card"><p class="text-xs uppercase text-slate-500">Saldo de cartera</p><p class="mt-2 text-xl font-bold">${formatCurrency(totalCartera)}</p></div><div class="kpi-card"><p class="text-xs uppercase text-slate-500">Clientes con saldo</p><p class="mt-2 text-xl font-bold">${customerIdsWithBalance.size}</p></div><div class="kpi-card"><p class="text-xs uppercase text-slate-500">Abonos registrados</p><p class="mt-2 text-xl font-bold">${formatCurrency(totalAbonos)}</p></div></div><section class="view-card"><h3 class="mb-3 text-base font-bold">Créditos por factura</h3><div class="overflow-x-auto rounded-lg border"><table class="min-w-full"><thead class="border-b bg-slate-50 text-xs uppercase"><tr><th class="px-3 py-2 text-left">Fecha</th><th class="px-3 py-2 text-left">Cliente</th><th class="px-3 py-2 text-left">Factura</th><th class="px-3 py-2 text-right">Crédito</th><th class="px-3 py-2 text-right">Abonado</th><th class="px-3 py-2 text-right">Saldo</th><th class="px-3 py-2 text-center">Acción</th></tr></thead><tbody>${creditRows || '<tr><td colspan="7" class="px-3 py-6 text-center text-sm text-slate-500">No hay créditos para mostrar</td></tr>'}</tbody></table></div></section><section class="view-card"><h3 class="mb-3 text-base font-bold">Historial de abonos</h3><div class="overflow-x-auto rounded-lg border"><table class="min-w-full"><thead class="border-b bg-slate-50 text-xs uppercase"><tr><th class="px-3 py-2 text-left">Fecha</th><th class="px-3 py-2 text-left">Cliente</th><th class="px-3 py-2 text-left">Factura</th><th class="px-3 py-2 text-right">Abono</th><th class="px-3 py-2 text-left">Método</th><th class="px-3 py-2 text-left">Observaciones</th></tr></thead><tbody>${paymentRows || '<tr><td colspan="6" class="px-3 py-6 text-center text-sm text-slate-500">Aún no hay abonos registrados</td></tr>'}</tbody></table></div></section></div>`;
    }

    async function registrarAbono(creditId, monto, metodoPago, observaciones = "") {
      const credit = (db.customerCredits || []).find(entry => entry.id === creditId);
      if (!credit) return false;
      const amount = Number(monto);
      const saldo = getCreditBalance(credit);
      if (!Number.isFinite(amount) || amount <= 0 || amount > saldo) {
        showToast("Ingresa un abono mayor que cero y no superior al saldo", "warning");
        return false;
      }
      if (!metodoPago || metodoPago === "Credito") {
        showToast("Selecciona un método de pago para el abono", "warning");
        return false;
      }

      const payment = { id: uid("pay"), creditId, monto: amount, fecha: new Date().toISOString(), metodoPago, observaciones: observaciones.trim() };
      db.customerPayments.push(payment);
      if (!await saveDB()) {
        db.customerPayments.pop();
        return false;
      }
      showToast("Abono registrado", "success");
      return true;
    }

    function showCreditPaymentModal(creditId) {
      const credit = (db.customerCredits || []).find(entry => entry.id === creditId);
      if (!credit) return;
      const saldo = getCreditBalance(credit);
      if (saldo <= 0) return showToast("Esta factura ya está pagada", "info");
      const customer = db.customers.find(entry => entry.id === credit.customerId);
      const methods = paymentMethods.filter(method => method.value !== "Credito").map(method => `<option value="${escapeHtml(method.value)}">${escapeHtml(method.label)}</option>`).join("");
      const div = document.createElement("div");
      div.className = "modal-content";
      div.innerHTML = `<div class="modal-header"><h3 class="text-lg font-bold">Registrar abono</h3></div><div class="modal-body"><p class="mb-4 text-sm text-slate-600">${escapeHtml(customer?.nombre || "Cliente")} · Factura ${escapeHtml(credit.saleId)} · Saldo ${formatCurrency(saldo)}</p><form id="creditPaymentForm" class="space-y-3"><div><label for="creditPaymentAmount" class="mb-1 block text-sm font-semibold">Valor del abono</label><input id="creditPaymentAmount" type="number" min="1" max="${saldo}" step="1" required class="w-full rounded-lg border px-3 py-2 text-sm" /></div><div><label for="creditPaymentMethod" class="mb-1 block text-sm font-semibold">Método de pago</label><select id="creditPaymentMethod" required class="w-full rounded-lg border bg-white px-3 py-2 text-sm">${methods}</select></div><div><label for="creditPaymentNotes" class="mb-1 block text-sm font-semibold">Observaciones</label><input id="creditPaymentNotes" type="text" maxlength="500" class="w-full rounded-lg border px-3 py-2 text-sm" /></div></form></div><div class="modal-footer"><button type="button" onclick="cerrarModal()" class="flex-1 rounded-lg border px-3 py-2 text-sm font-semibold">Cancelar</button><button type="submit" form="creditPaymentForm" class="flex-1 rounded-lg bg-slate-900 px-3 py-2 text-sm font-semibold text-white">Guardar abono</button></div>`;
      document.getElementById("modalContent").innerHTML = "";
      document.getElementById("modalContent").appendChild(div);
      document.getElementById("modalBackdrop").classList.add("active");
      document.getElementById("creditPaymentForm").addEventListener("submit", async event => {
        event.preventDefault();
        const saved = await registrarAbono(creditId, document.getElementById("creditPaymentAmount").value, document.getElementById("creditPaymentMethod").value, document.getElementById("creditPaymentNotes").value);
        if (saved) {
          cerrarModal();
          renderView();
        }
      });
    }

    function productoTieneHistorial(productId) {
      return db.sales.some(sale => (sale.items || []).some(item => item.productId === productId))
        || db.purchases.some(purchase => (purchase.items || []).some(item => item.productId === productId))
        || db.movements.some(movement => movement.productoId === productId);
    }

    async function setProductActive(productId, active) {
      const product = db.products.find(entry => entry.id === productId);
      if (!product || product.activo === active) return;
      const previousState = product.activo;
      product.activo = active;
      if (!await saveDB()) {
        product.activo = previousState;
        return;
      }
      showToast(active ? "Producto activado" : "Producto desactivado", "success");
      renderView();
    }

    async function eliminarProducto(productId) {
      const productIndex = db.products.findIndex(entry => entry.id === productId);
      if (productIndex === -1) return;
      const product = db.products[productIndex];
      if (productoTieneHistorial(productId)) {
        showToast("Este producto tiene historial. Desactívalo para conservar sus ventas y compras.", "warning");
        return;
      }
      if (!confirm(`¿Eliminar el producto ${product.nombre}? Esta acción no se puede deshacer.`)) return;

      db.products.splice(productIndex, 1);
      if (!await saveDB()) {
        db.products.splice(productIndex, 0, product);
        return;
      }
      showToast("Producto eliminado", "success");
      renderView();
    }

    async function eliminarVenta(saleId) {
      if (appState.savingSale) return;
      const saleIndex = db.sales.findIndex(entry => entry.id === saleId);
      if (saleIndex === -1) return;
      const sale = db.sales[saleIndex];
      const saleCreditIds = (db.customerCredits || []).filter(credit => credit.saleId === saleId).map(credit => credit.id);
      if ((db.customerPayments || []).some(payment => saleCreditIds.includes(payment.creditId))) {
        showToast("No se puede eliminar: esta venta a crédito ya tiene abonos registrados.", "warning");
        return;
      }
      document.getElementById("modalContent").innerHTML = `
        <form id="saleDeletionForm" class="modal-content" role="dialog" aria-modal="true" aria-labelledby="saleDeletionTitle">
          <div class="modal-header"><h2 id="saleDeletionTitle" class="text-lg font-bold">Autorizar eliminación</h2></div>
          <div class="modal-body space-y-3">
            <p class="text-sm break-words">Venta ${escapeHtml(sale.id)} por <strong>${formatCurrency(sale.total)}</strong></p>
            <p class="text-sm">Se devolverá al inventario el stock descontado por esta venta.</p>
            <div>
              <label for="saleDeletionCode" class="block text-sm font-semibold mb-1">Código de autorización</label>
              <input id="saleDeletionCode" type="password" required pattern="[A-Za-z0-9]+" maxlength="128" autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="saleDeletionError" class="w-full px-3 py-2 border rounded-lg text-sm" />
            </div>
            <p id="saleDeletionError" role="alert" class="text-sm text-red-700"></p>
          </div>
          <div class="modal-footer">
            <button id="cancelSaleDeletion" type="button" onclick="cerrarModal()" class="flex-1 px-3 py-2 border rounded-lg font-semibold text-sm">Cancelar</button>
            <button id="confirmSaleDeletion" type="submit" class="flex-1 px-3 py-2 bg-red-700 text-white rounded-lg font-semibold text-sm">Autorizar y eliminar</button>
          </div>
        </form>`;
      document.getElementById("saleDeletionForm").addEventListener("submit", event => {
        event.preventDefault();
        confirmarEliminarVenta(saleId);
      });
      document.getElementById("modalBackdrop").classList.add("active");

    async function confirmarEliminarVenta(saleId) {
      if (appState.savingSale) return;
      const input = document.getElementById("saleDeletionCode");
      const error = document.getElementById("saleDeletionError");
      const authorizationCode = input?.value || "";
      if (!/^[A-Za-z0-9]{1,128}$/.test(authorizationCode)) {
        if (error) error.textContent = "Ingresa un código de autorización alfanumérico válido.";
        input?.focus();
        return;
      }
      const saleIndex = db.sales.findIndex(entry => entry.id === saleId);
      if (saleIndex === -1) return;
      const sale = db.sales[saleIndex];
      const saleCreditIds = (db.customerCredits || []).filter(credit => credit.saleId === saleId).map(credit => credit.id);
      if ((db.customerPayments || []).some(payment => saleCreditIds.includes(payment.creditId))) {
        error.textContent = "No se puede eliminar: esta venta a crédito ya tiene abonos registrados.";
        input.value = "";
        return;
      }

      const stockBefore = new Map(db.products.map(product => [product.id, product.stockActual]));
      const invoicesBefore = Array.isArray(db.invoices) ? db.invoices : null;
      const creditsBefore = db.customerCredits || [];
      db.sales.splice(saleIndex, 1);
      db.customerCredits = creditsBefore.filter(credit => credit.saleId !== saleId);
      for (const item of sale.items || []) {
        if (item.tipo === "servicio" || item.stockDescontado === false) continue;
        const product = db.products.find(entry => entry.id === item.productId);
        if (product) product.stockActual += item.cantidad;
      }
      if (invoicesBefore) db.invoices = invoicesBefore.filter(invoice => invoice.saleId !== saleId);

      const confirmButton = document.getElementById("confirmSaleDeletion");
      const cancelButton = document.getElementById("cancelSaleDeletion");
      appState.savingSale = true;
      appState.deletingSale = true;
      input.value = "";
      input.disabled = true;
      confirmButton.disabled = true;
      cancelButton.disabled = true;
      error.textContent = "";
      let saved = false;
      try {
        saved = await saveDB(authorizationCode);
      } finally {
        appState.savingSale = false;
        appState.deletingSale = false;
        input.disabled = false;
        confirmButton.disabled = false;
        cancelButton.disabled = false;
      }
      if (!saved) {
        db.sales.splice(saleIndex, 0, sale);
        db.customerCredits = creditsBefore;
        db.products.forEach(product => { product.stockActual = stockBefore.get(product.id); });
        if (invoicesBefore) db.invoices = invoicesBefore;
        error.textContent = "No se eliminó la venta. Verifica la autorización e intenta nuevamente.";
        input.focus();
        return;
      }
      showToast("Venta eliminada y stock restaurado", "success");
      cerrarModal();
    }

      const serviceSummary = new Map();
      salesFiltered.flatMap(sale => sale.items).filter(item => item.tipo === "servicio").forEach(item => {

        summary.cantidad += item.cantidad;

    function ventasPorCategoria(sales) {
      const catMap = {};
      sales.forEach(sale => {
        sale.items.forEach(item => {
          if (item.tipo === "servicio") return;
          const product = db.products.find(p => p.id === item.productId);
          if (!product) return;
          if (!catMap[product.categoria]) catMap[product.categoria] = { categoria: product.categoria, cantidad: 0, ventas: 0, costo: 0 };
          catMap[product.categoria].cantidad += item.cantidad;
          catMap[product.categoria].ventas += item.cantidad * item.precio;
          catMap[product.categoria].costo += item.cantidad * product.precioCompra;
        });
      });
      return Object.values(catMap).map(c => ({ ...c, ganancia: c.ventas - c.costo, margen: c.ventas > 0 ? ((c.ventas - c.costo) / c.ventas) * 100 : 0 }));
    }

    function ventasPorDia(sales) {
      const dayMap = {};
      sales.forEach(sale => {
        const date = new Date(sale.fecha);
        const dateStr = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
        if (!dayMap[dateStr]) dayMap[dateStr] = { fecha: dateStr, total: 0, cantidad: 0 };
        dayMap[dateStr].total += sale.total;
        dayMap[dateStr].cantidad += 1;
      });
      return Object.values(dayMap).sort((a, b) => a.fecha.localeCompare(b.fecha));
    }

    function addToCart(productId, nombre, precio) {

      if (tipoPrecio === "mayorista" && (!Number.isFinite(Number(precio)) || Number(precio) <= 0)) {
        showToast("Este producto no tiene precio mayorista registrado", "warning");
        return;
      }
      const existing = appState.cart.find(c => c.productId === productId && (c.tipoPrecio || "detal") === tipoPrecio);
      if (existing) {
        existing.cantidad += 1;
      } else {
        appState.cart.push({ productId, nombre, precio, cantidad: 1, tipoPrecio });
      }
      showToast(`${nombre} agregado al carrito`, "success");
      updateCartBadge();
      renderView();

      const input = document.getElementById(`qty-${productId}`);
      let newValue = parseInt(input.value) + change;
      const maxStock = parseInt(input.max);
      if (newValue < 1) newValue = 1;
      if (newValue > maxStock) newValue = maxStock;
      input.value = newValue;
    }

    function addToCartQty(productId, nombre, precio, tipoPrecio = getPosPriceMode()) {
      if (tipoPrecio === "mayorista" && (!Number.isFinite(Number(precio)) || Number(precio) <= 0)) {
        showToast("Este producto no tiene precio mayorista registrado", "warning");
        return;
      }
      const input = document.getElementById(`qty-${productId}`);
      const cantidad = parseInt(input.value) || 1;
      
      const existing = appState.cart.find(c => c.productId === productId && (c.tipoPrecio || "detal") === tipoPrecio);
      if (existing) {
        existing.cantidad += cantidad;
      } else {
        appState.cart.push({ productId, nombre, precio, cantidad, tipoPrecio });
      }

    function focusBarcodeScanner() {
      document.getElementById("barcodeScannerInput")?.focus?.({ preventScroll: true });
    }

    function handleBarcodeScanner(event) {
      if (event.key !== "Enter") return;
      event.preventDefault();
      procesarCodigoBarras();
    }

    function procesarCodigoBarras(rawCode) {
      const input = document.getElementById("barcodeScannerInput");
      const code = String(rawCode ?? input?.value ?? "").trim();
      if (input) input.value = "";
      if (!code) return;

      const normalizedCode = code.toLocaleLowerCase();
      const product = db.products.find(entry => entry.activo !== false && String(entry.codigoBarras || "").trim().toLocaleLowerCase() === normalizedCode);
      if (!product) {
        showToast(`No hay un producto activo con el código ${code}`, "warning");
        focusBarcodeScanner();
        return;
      }

      const tipoPrecio = getPosPriceMode();
      const precio = Number(getProductSalePrice(product, tipoPrecio));
      if (!Number.isFinite(precio) || precio <= 0) {
        showToast("Este producto no tiene precio para la modalidad seleccionada", "warning");
        focusBarcodeScanner();
        return;
      }

      const existing = appState.cart.find(item => item.productId === product.id && (item.tipoPrecio || "detal") === tipoPrecio);
      const cantidadActual = existing?.cantidad || 0;
      if (Number(product.stockActual) <= cantidadActual) {
        showToast(`Stock insuficiente para ${product.nombre}`, "warning");
        focusBarcodeScanner();
        return;
      }

      if (existing) existing.cantidad += 1;
      else appState.cart.push({ productId: product.id, nombre: product.nombre, precio, cantidad: 1, tipoPrecio });
      showToast(`${product.nombre} agregado al carrito`, "success");
      updateCartBadge();
      renderView();
    }

    function actualizarCampoComision() {
      const method = document.getElementById("metodoSelect")?.value;
      const commissionGroup = document.getElementById("commissionGroup");
      const commissionSelect = document.getElementById("commissionSelect");
      const applies = commissionPaymentMethods.has(method);
      if (commissionGroup) commissionGroup.classList.toggle("hidden", !applies);
      if (commissionSelect) {
        commissionSelect.required = applies;
        if (method === "QR") commissionSelect.value = "1.5";
        else if (!applies || commissionSelect.value === "1.5") commissionSelect.value = "";
      }
      actualizarResumenComision();
    }

    function calcularValorComision(base, percentage) {
      return Math.round(Number(base || 0) * Number(percentage || 0) / 100);
    }

    function calcularComisionEntidad(method, total, percentage, amount) {
      if (method === "QR") return { porcentaje: Number(percentage), valor: amount };
      if (method === "Tarjeta" || method === "Tarjeta débito") {
        return { porcentaje: 2.67, valor: calcularValorComision(total, 2.67) + 300 };
      }
      if (entityFeePaymentMethods.has(method)) {
        return { porcentaje: entityFeeRate, valor: calcularValorComision(total, entityFeeRate) };
      }
      return { porcentaje: null, valor: 0 };
    }

    function actualizarResumenComision() {
      const method = document.getElementById("metodoSelect")?.value;
      const commissionSelect = document.getElementById("commissionSelect");
      const commissionRow = document.getElementById("commissionAmountRow");
      const entityFeeRow = document.getElementById("entityFeeRow");
      const netReceivedRow = document.getElementById("netReceivedRow");
      const percentage = Number(commissionSelect?.value || 0);
      const applies = commissionPaymentMethods.has(method) && commissionRates.includes(percentage);
      const base = Number(commissionRow?.dataset.base || 0);
      const amount = applies ? calcularValorComision(base, percentage) : 0;
      const isQr = method === "QR";
      const total = base + (applies && !isQr ? amount : 0);
      const retention = applies ? calcularComisionEntidad(method, total, percentage, amount) : { porcentaje: null, valor: 0 };
      const hasEntityFee = !isQr && retention.porcentaje != null;
      const entityFee = retention.valor;
      const netReceived = Math.max(0, total - entityFee);
      if (commissionRow) commissionRow.classList.toggle("hidden", !applies);
      if (entityFeeRow) entityFeeRow.classList.toggle("hidden", !hasEntityFee);
      if (netReceivedRow) netReceivedRow.classList.toggle("hidden", (!isQr && !hasEntityFee) || !applies);
      const label = document.getElementById("commissionAmountLabel");
      const amountValue = document.getElementById("commissionAmountValue");
      const entityFeeLabel = document.getElementById("entityFeeLabel");
      const entityFeeValue = document.getElementById("entityFeeValue");
      const totalValue = document.getElementById("checkoutTotal");
      const netReceivedValue = document.getElementById("netReceivedValue");
      if (label && applies) label.textContent = isQr ? `Comisión bancaria QR (${percentage}%):` : `Comisión al cliente (${percentage}%):`;
      if (amountValue) amountValue.textContent = formatCurrency(amount);
      if (entityFeeLabel && hasEntityFee) {
        entityFeeLabel.textContent = entityFeePaymentMethods.has(method)
          ? `Retención ${method === "SisteCredito" ? "SisteCrédito" : "Addi"} (${entityFeeRate}%):`
          : `Retención bancaria (2,67% + ${formatCurrency(300)}):`;
      }
      if (entityFeeValue) entityFeeValue.textContent = formatCurrency(entityFee);
      if (netReceivedValue) netReceivedValue.textContent = formatCurrency(netReceived);
      if (totalValue) totalValue.textContent = formatCurrency(total);
    }

    async function confirmarVenta() {
      if (!appState.cart.length || appState.savingSale) return;
      const clienteId = document.getElementById("clienteSelect").value || null;
      const metodo = document.getElementById("metodoSelect").value;
      const comisionInput = document.getElementById("commissionSelect")?.value || "";
      const requiereComision = commissionPaymentMethods.has(metodo);
      if (metodo === "Credito" && !clienteId) {
        showToast("Debe seleccionar un cliente para ventas a crédito.", "warning");
        return;
      }
      if (requiereComision && !commissionRates.includes(Number(comisionInput))) {
        showToast("Selecciona el porcentaje de comisión para este medio de pago.", "warning");
        return;
      }

      const subtotal = appState.cart.reduce((s, i) => s + i.precio * i.cantidad, 0);
      const iva = 0;
      const comisionValor = requiereComision ? calcularValorComision(subtotal + iva, comisionInput) : 0;
      const total = subtotal + iva + (metodo === "QR" ? 0 : comisionValor);
      const { porcentaje: comisionEntidadPorcentaje, valor: comisionEntidadValor } = calcularComisionEntidad(metodo, total, comisionInput, comisionValor);
      const netoRecibido = Math.max(0, total - comisionEntidadValor);

      const sale = {
        id: uid("sale"),
        fecha: new Date().toISOString(),
        clienteId,
        items: appState.cart.map(c => {
          if (c.tipo === "servicio") return { ...c };
          const product = db.products.find(entry => entry.id === c.productId);
          return { productId: c.productId, cantidad: c.cantidad, precio: c.precio, stockDescontado: Boolean(product && product.stockActual > 0) };
        }),
        subtotal,
        iva,
        total,
        metodoPago: metodo,
        comisionPorcentaje: requiereComision ? Number(comisionInput) : null,
        comisionValor,
        comisionEntidadPorcentaje,
        comisionEntidadValor,
        netoRecibido
      };

      const stockBefore = new Map(db.products.map(product => [product.id, product.stockActual]));
      const customerCredit = metodo === "Credito" ? {
        id: uid("credit"),
        saleId: sale.id,
        customerId: clienteId,
        monto: total,
        fecha: sale.fecha
      } : null;
      sale.items.forEach(item => {
        if (item.tipo === "servicio") return;
        const product = db.products.find(p => p.id === item.productId);
        if (product && item.stockDescontado) {
          product.stockActual -= item.cantidad;
        }
      });
      db.sales.push(sale);
      if (customerCredit) db.customerCredits.push(customerCredit);
      appState.savingSale = true;
      const saved = await saveDB();
      appState.savingSale = false;
      if (!saved) {
        db.sales = db.sales.filter(entry => entry.id !== sale.id);
        if (customerCredit) db.customerCredits = db.customerCredits.filter(credit => credit.id !== customerCredit.id);
        db.products.forEach(product => { product.stockActual = stockBefore.get(product.id); });
        return;
      }
      appState.cart = [];
      updateCartBadge();

      showToast("Venta procesada exitosamente", "success");
      cerrarModal();

      setTimeout(() => {
        verFactura(sale.id);
      }, 300);
    }

              <p class="font-semibold">FACTURA: ${sale.id}</p>
              <p class="font-semibold mt-2">FECHA: ${formatDate(sale.fecha)}</p>
            </div>
            <div class="text-right">
              <p class="font-semibold">CLIENTE: ${customer?.nombre || "CONSUMIDOR"}</p>
              <p class="font-semibold mt-2">PAGO: ${escapeHtml(sale.metodoPago || "No especificado")}</p>
            </div>
          </div>

          <table class="w-full mb-3 text-sm border-collapse">
            <thead class="bg-slate-900 text-white">
              <tr><th class="px-2 py-1 text-left">Descripcion</th><th class="px-2 py-1 text-right">Qty</th><th class="px-2 py-1 text-right">P.Unit</th><th class="px-2 py-1 text-right">Subtotal</th></tr>
            </thead>
            <tbody>${itemsHtml}</tbody>
          </table>

          <div class="bg-slate-50 p-2 rounded-lg text-sm space-y-1 border-2 border-slate-900">
            <div class="flex justify-between"><span>Subtotal:</span><span class="font-semibold">${formatCurrency(sale.subtotal)}</span></div>
            <div class="flex justify-between"><span>IVA:</span><span class="font-semibold">${formatCurrency(sale.iva || 0)}</span></div>
            ${sale.comisionPorcentaje == null || sale.metodoPago === "QR" ? "" : `<div class="flex justify-between"><span>Comisión (${Number(sale.comisionPorcentaje)}%):</span><span class="font-semibold">${formatCurrency(sale.comisionValor)}</span></div>`}
            <div class="flex justify-between border-t pt-1 text-base"><span class="font-bold">TOTAL:</span><span class="font-bold">${formatCurrency(sale.total)}</span></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" onclick="imprimirFactura()" class="flex-1 px-3 py-2 border rounded-lg font-semibold">Imprimir</button>
          <button type="button" onclick="cerrarModal()" class="flex-1 px-3 py-2 bg-slate-900 text-white rounded-lg font-semibold">Cerrar</button>
        </div>
      `;

      document.getElementById("modalContent").innerHTML = "";
      document.getElementById("modalContent").appendChild(div);
      document.getElementById("modalBackdrop").classList.add("active");
      document.getElementById("thermalPrintRoot").innerHTML = receiptHtml;
    }

    function imprimirFactura() {
      if (!document.getElementById("thermalReceipt")) return;
      window.print();
    }

    function cerrarModal() {
      if (appState.deletingSale) return;
      const authorizationInput = document.getElementById("saleDeletionCode");
      if (authorizationInput) authorizationInput.value = "";
      document.getElementById("modalBackdrop").classList.remove("active");
      document.getElementById("thermalPrintRoot").innerHTML = "";
      renderView();
    }

    function startClock() {
      const update = () => {
        document.getElementById("liveClock").textContent = new Intl.DateTimeFormat("es-CO", { hour: "2-digit", minute: "2-digit", second: "2-digit" }).format(new Date());
      };
      update();
      setInterval(update, 1000);
    }
    function toggleSidebar() {
      const aside = document.querySelector("aside");
      aside.classList.toggle("collapsed");
      localStorage.setItem("sidebarCollapsed", aside.classList.contains("collapsed"));
    }

    function restoreSidebarState() {
      const isCollapsed = localStorage.getItem("sidebarCollapsed") === "true";
      const aside = document.querySelector("aside");
      if (isCollapsed) {
        aside.classList.add("collapsed");
      }
    }

    async function resetDatabase() {
      if (confirm("¿Estás seguro? Esto eliminará TODOS los cambios y volverá a los datos por defecto.")) {
        db = createDefaultDB();
        await saveDB();
        revisarCumpleanos(new Date(), true);
        showToast("Base de datos restaurada a valores iniciales", "success");
        renderView();
      }
    }

    function exportDatabase() {
      const dataStr = JSON.stringify(db, null, 2);
      const dataBlob = new Blob([dataStr], { type: "application/json" });
      const url = URL.createObjectURL(dataBlob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `mujer-magica-backup-${new Date().toISOString().split("T")[0]}.json`;
      link.click();
      showToast("Base de datos exportada", "success");
    }

    // ==================== EVENTOS ====================
    document.getElementById("toggleSidebar").addEventListener("click", toggleSidebar);

    document.getElementById("globalSearch").addEventListener("input", e => {
      appState.searchTerm = e.target.value;
      renderView();
    });

    document.getElementById("cartBtn").addEventListener("click", () => {
      appState.currentRoute = "pos";
      renderView();
    });

    document.getElementById("alertBtn").addEventListener("click", () => {
      appState.currentRoute = "dashboard";
      renderView();
    });

    document.getElementById("birthdayBtn").addEventListener("click", showBirthdayAlertsModal);

    document.getElementById("modalBackdrop").addEventListener("click", (e) => {
      if (e.target === document.getElementById("modalBackdrop")) {
        cerrarModal();
      }
    });

    // ==================== INICIO ====================
    async function iniciarApp() {
      const remoto = await loadDB();

      const remotoValido = remoto
        && Array.isArray(remoto.products)
        && Array.isArray(remoto.providers)
        && Array.isArray(remoto.customers)
        && Array.isArray(remoto.sales)
        && Array.isArray(remoto.purchases)
        && Array.isArray(remoto.movements);

      if (remotoValido && remoto.products.length > 0) {
        db = remoto;
      } else {
        const legadoKey = localStorage.getItem("mujermagicaDB")
          ? "mujermagicaDB"
          : (localStorage.getItem("mujermagicaDB_backup") ? "mujermagicaDB_backup" : null);
        const legado = legadoKey ? localStorage.getItem(legadoKey) : null;
        let migrado = false;
        if (legado) {
          const migrar = confirm(`Se encontraron datos guardados en este navegador (${legadoKey}). ¿Deseas migrarlos ahora a la base de datos MySQL?`);
          if (migrar) {
            migrado = await migrarDatosLocalStorage(legado);
          }
        }

        if (migrado) {
          db = await loadDB();
        } else {
          if (!remotoValido) {
            db = createDefaultDB();
            showToast("No se pudo conectar con el backend. Verifica que esté corriendo en el puerto 4000.", "danger");
          } else {
            // Si MySQL responde pero está vacío, no sobreescribir automáticamente.
            db = remoto;
            showToast("Conectado a MySQL, pero no hay productos cargados todavía.", "warning");
          }
        }
      }

      restoreSidebarState();
      renderView();
      if (appState.currentRoute === "pos" && appState.posTab !== "servicios") focusBarcodeScanner();
      startClock();
      calcularAlertas();
      startBirthdayChecks();
    }

    iniciarApp();
  </script>
</body>
</html>
