<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mujer Magica - Sistema Completo POS + Inventario + Reportes</title>
  <link rel="icon" type="image/png" href="images/logo_fav_icon.png?v=2" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --brand-primary: #f97316; --brand-secondary: #14b8a6; }
    body { font-family: "Manrope", sans-serif; }
    h1, h2, h3, h4, h5, h6 { font-family: "Sora", sans-serif; }
    .app-bg { background: radial-gradient(circle at 12% 10%, rgba(249, 115, 22, 0.16), transparent 28%), radial-gradient(circle at 88% 20%, rgba(20, 184, 166, 0.16), transparent 34%), linear-gradient(145deg, #fff7ed, #ecfeff 50%, #eff6ff); }
    .panel-glass { backdrop-filter: blur(18px); background: linear-gradient(165deg, rgba(255, 255, 255, 0.88), rgba(255, 255, 255, 0.66)); box-shadow: 0 18px 44px -18px rgba(15, 23, 42, 0.28); }
    .brand-gradient { background: linear-gradient(135deg, #ea580c, #f59e0b 50%, #0f766e 100%); }
    .nav-link { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 14px; border-radius: 14px; color: #334155; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 180ms ease; border: 1px solid transparent; }
    .nav-link:hover { background: rgba(255, 255, 255, 0.85); }
    .nav-link.active { background: rgba(15, 23, 42, 0.92); color: #fff; }
    .kpi-card { border-radius: 20px; border: 1px solid rgba(226, 232, 240, 0.9); background: rgba(255, 255, 255, 0.84); padding: 18px; }
    .view-card { border-radius: 20px; border: 1px solid rgba(226, 232, 240, 0.9); background: rgba(255, 255, 255, 0.86); padding: 18px; }
    .stock-badge { border-radius: 999px; padding: 6px 12px; font-size: 11px; font-weight: 700; }
    .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); z-index: 40; }
    .modal-backdrop.active { display: flex; align-items: center; justify-content: center; }
    .modal-content { background: white; border-radius: 20px; display: flex; flex-direction: column; width: calc(100% - 2rem); max-width: 600px; max-height: calc(100vh - 2rem); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); }
    .modal-content.modal-wide { max-width: 820px; }
    .modal-header { padding: 20px; border-bottom: 1px solid #e2e8f0; flex-shrink: 0; }
    .modal-body { padding: 16px 20px; overflow-y: auto; flex: 1; min-height: 0; }
    .modal-footer { padding: 16px 20px; border-top: 1px solid #e2e8f0; display: flex; gap: 8px; flex-shrink: 0; }
    .modal-body img { max-width: 80px; max-height: 80px; border-radius: 8px; object-fit: cover; }
    .toast-item { border-radius: 14px; color: #fff; font-size: 13px; padding: 10px 14px; animation: slide-up 220ms ease; }
    @keyframes slide-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeInOut { 0% { opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { opacity: 0; } }
    .cart-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px; background: #ef4444; color: white; border-radius: 999px; font-size: 11px; font-weight: bold; }
    .product-card { border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; text-align: center; transition: all 200ms ease; display: flex; flex-direction: column; }
    .product-card:hover { border-color: #0f766e; box-shadow: 0 4px 12px rgba(15, 118, 110, 0.15); }
    .chart-bar { height: 100%; border-radius: 4px; background: linear-gradient(90deg, #0f766e, #14b8a6); display: block; transition: width 300ms ease; }
    .rank-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 28px; border-radius: 50%; font-weight: bold; font-size: 12px; }
    .rank-1 { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: white; }
    .rank-2 { background: linear-gradient(135deg, #c7d2fe, #a5b4fc); color: #3730a3; }
    .rank-3 { background: linear-gradient(135deg, #fed7aa, #fb923c); color: white; }
    .metric-up { color: #10b981; }
    .metric-down { color: #ef4444; }
    .status-card { border-radius: 16px; border-left: 4px solid; padding: 12px; }
    .status-optimal { border-left-color: #10b981; background: #ecfdf5; }
    .status-warning { border-left-color: #f59e0b; background: #fffbeb; }
    .status-critical { border-left-color: #ef4444; background: #fef2f2; }
    .nav-category { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; padding: 12px 14px; margin-top: 10px; }
    .sidebar-toggle { width: 44px; height: 44px; padding: 8px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: rgba(255, 255, 255, 0.2); border: 1px solid rgba(255, 255, 255, 0.3); color: white; cursor: pointer; transition: all 200ms ease; }
    .sidebar-toggle:hover { background: rgba(255, 255, 255, 0.3); }
    aside { transition: transform 300ms ease, width 300ms ease; width: 280px; }
    aside.collapsed { transform: translateX(-100%); width: 0; }
    @media (max-width: 1024px) { aside { position: fixed; left: 0; top: 0; height: 100vh; z-index: 30; } aside.collapsed { transform: translateX(-100%); } }
    #toggleSidebar { position: fixed; top: 20px; left: 20px; z-index: 35; display: none; }
    @media (max-width: 1024px) { #toggleSidebar { display: flex; } }
    main { flex: 1; }
    .cart-alerts-top { display: flex; gap: 8px; align-items: center; z-index: 20; flex-wrap: wrap; }
    .thermal-receipt { display: none; }
    #thermalPrintRoot { display: none; }
    @media print {
      @page { margin: 0; }
      html, body { width: 58mm !important; min-width: 0 !important; min-height: 0 !important; height: auto !important; margin: 0 !important; padding: 0 !important; overflow: visible !important; background: #fff !important; }
      body > :not(#thermalPrintRoot) { display: none !important; }
      #thermalPrintRoot { display: block !important; position: static !important; width: 58mm !important; min-height: 0 !important; height: auto !important; margin: 0 !important; padding: 0 !important; overflow: visible !important; }
      #thermalReceipt, #thermalReceipt * { visibility: visible !important; }
      #thermalReceipt { position: static !important; display: block !important; width: 48mm !important; min-height: 0 !important; height: auto !important; margin: 0 !important; padding: 3mm 1mm !important; color: #000 !important; background: #fff !important; font: 9pt/1.25 Arial, sans-serif !important; box-sizing: border-box !important; }
      #thermalReceipt .receipt-center { text-align: center !important; }
      #thermalReceipt .receipt-title { font-size: 12pt !important; font-weight: 700 !important; }
      #thermalReceipt .receipt-separator { border-top: 1px dashed #000 !important; margin: 2mm 0 !important; }
      #thermalReceipt .receipt-line { margin: 1.5mm 0 !important; break-inside: avoid; }
      #thermalReceipt .receipt-item-name { font-weight: 700 !important; overflow-wrap: anywhere !important; }
      #thermalReceipt .receipt-detail { display: flex !important; justify-content: space-between !important; gap: 2mm !important; }
      #thermalReceipt .receipt-total { font-size: 11pt !important; font-weight: 700 !important; }
      #thermalReceipt .receipt-small { font-size: 8pt !important; overflow-wrap: anywhere !important; }
      #thermalReceipt .receipt-logo { display: block !important; width: 23mm !important; height: auto !important; margin: 0 auto 2mm !important; object-fit: contain !important; }
      #thermalReceipt .receipt-address { font-size: 7.5pt !important; overflow-wrap: anywhere !important; }
      #thermalReceipt .receipt-amount { white-space: nowrap !important; }
      #toggleSidebar, #modalHeader, .modal-header, .modal-footer, #toastHost { display: none !important; }
    }
  </style>
</head>
<body class="app-bg text-slate-800">
  <div class="min-h-screen p-4 md:p-6">
    <button id="toggleSidebar" class="sidebar-toggle">☰</button>
    <div class="mx-auto grid max-w-[1440px] grid-cols-1 gap-4 lg:grid-cols-[280px_1fr] relative">
      <!-- SIDEBAR -->
      <aside class="panel-glass rounded-3xl border border-white/60 lg:sticky lg:top-6 h-fit lg:h-[calc(100vh-80px)] flex flex-col">
        <div class="brand-gradient px-6 py-7 text-white flex-shrink-0">
          <p class="text-xs uppercase tracking-[0.2em] text-white/80">Mujer Magica</p>
          <h1 class="text-2xl font-bold">Sistema Integrado</h1>
          <p class="mt-2 text-sm text-white/90">POS + Inventario + Reportes</p>
        </div>
        <nav id="sidebarNav" class="space-y-2 px-4 py-4 overflow-y-auto flex-1"></nav>
      </aside>

      <!-- MAIN -->
      <main class="space-y-4">
        <header class="panel-glass rounded-3xl border border-white/60 p-4 md:p-5">
          <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between md:gap-4">
            <h2 id="viewTitle" class="text-2xl font-bold min-w-fit">Bienvenido</h2>
            <input id="globalSearch" class="rounded-xl border border-slate-200 bg-white/80 px-4 py-2.5 text-sm flex-1 md:flex-1" placeholder="Buscar..." />
            <div class="cart-alerts-top">
              <button id="cartBtn" class="rounded-2xl bg-orange-600 text-white px-3 py-2 text-xs font-semibold flex items-center justify-center gap-2 whitespace-nowrap">🛒 <span class="cart-badge">0</span></button>
              <button id="alertBtn" class="rounded-2xl bg-red-600 text-white px-3 py-2 text-xs font-semibold flex items-center justify-center gap-2 whitespace-nowrap">⚠️ <span class="alert-count">0</span></button>
              <button id="birthdayBtn" type="button" title="Cumpleaños próximos" aria-label="Cumpleaños próximos" class="rounded-2xl bg-teal-700 text-white px-3 py-2 text-xs font-semibold flex items-center justify-center gap-2 whitespace-nowrap"><span aria-hidden="true">&#128276;</span><span id="birthdayCount" aria-live="polite">0</span></button>
              <div class="rounded-2xl bg-slate-900 text-white px-3 py-2 text-xs font-semibold text-center whitespace-nowrap">
                <p id="liveClock">--:--:--</p>
              </div>
            </div>
          </div>
        </header>
        <section id="appView" class="space-y-4"></section>
      </main>
    </div>
  </div>

  <div id="toastHost" class="pointer-events-none fixed bottom-5 right-5 z-50 space-y-2"></div>
  <div id="modalBackdrop" class="modal-backdrop"><div id="modalContent"></div></div>
  <div id="thermalPrintRoot" aria-hidden="true"></div>

  <script>
    // ==================== UTILIDADES ====================
    const formatCurrency = (v) => new Intl.NumberFormat("es-CO", { style: "currency", currency: "COP", maximumFractionDigits: 0 }).format(v || 0);
    const formatDate = (d) => { const date = new Date(d); return Number.isNaN(date.getTime()) ? "--" : new Intl.DateTimeFormat("es-CO", { year: "numeric", month: "short", day: "2-digit" }).format(date); };
    const paymentMethods = [
      { value: "Efectivo", label: "Efectivo" },
      { value: "Tarjeta", label: "Tarjeta crédito" },
      { value: "Tarjeta débito", label: "Tarjeta débito" },
      { value: "Transferencia", label: "Transferencia bancaria" },
      { value: "Nequi", label: "Nequi" },
      { value: "Daviplata", label: "Daviplata" },
      { value: "QR", label: "Pago por QR" },
      { value: "SisteCredito", label: "SisteCrédito" },
      { value: "Addi", label: "Addi" },
      { value: "Otro", label: "Otro" },
      { value: "Credito", label: "Crédito" }
    ];
    const commissionPaymentMethods = new Set(["Tarjeta", "Tarjeta débito", "QR", "SisteCredito", "Addi"]);
    const entityFeePaymentMethods = new Set(["SisteCredito", "Addi"]);
    const entityFeeRate = 2;
    const commissionRates = [1.5, 2, 3, 4, 5];
    const getLocalDateInputValue = (value) => {
      const date = value instanceof Date ? value : new Date(value);
      if (Number.isNaN(date.getTime())) return "";
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
    };
    const uid = (p = "id") => `${p}_${Math.random().toString(36).slice(2, 10)}`;
    const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, character => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[character]));
    const showToast = (m, t = "info") => { const h = document.getElementById("toastHost"); if (!h) return; const p = { info: "bg-slate-900", success: "bg-emerald-700", warning: "bg-amber-700", danger: "bg-red-700" }; const e = document.createElement("div"); e.className = `toast-item ${p[t] || p.info}`; e.textContent = m; h.appendChild(e); setTimeout(() => e.remove(), 2600); };

    // ==================== BASE DE DATOS (MySQL via backend-node) ====================
    const today = new Date().toISOString();
    const API_BASE = "http://localhost:4000/api";

    // Guarda el estado completo en MySQL (reemplaza el antiguo localStorage)
    async function saveDB(authorizationCode = "") {
      try {
        const res = await fetch(`${API_BASE}/state`, {
          method: "PUT",
          headers: { "Content-Type": "application/json", ...(authorizationCode ? { "X-Sale-Delete-Code": authorizationCode } : {}) },
          body: JSON.stringify(db)
        });
        if (!res.ok) {
          const failure = await res.json().catch(() => ({}));
          showToast([403, 503].includes(res.status) ? failure.error || "No se autorizó la eliminación." : "No se pudo guardar en MySQL.", "danger");
          return false;
        }

        const indicator = document.createElement("div");
        indicator.style.cssText = "position: fixed; top: 20px; right: 20px; background: #10b981; color: white; padding: 8px 16px; border-radius: 6px; font-size: 12px; z-index: 9999; animation: fadeInOut 2s ease-in-out;";
        indicator.textContent = "✓ Guardado en MySQL";
        document.body.appendChild(indicator);
        setTimeout(() => indicator.remove(), 2000);
        return true;
      } catch (e) {
        console.error("Error guardando BD:", e);
        showToast("No se pudo guardar en MySQL. ¿Está corriendo el backend en el puerto 4000?", "danger");
        return false;
      }
    }

    // Carga el estado completo desde MySQL. Devuelve null si el backend no responde.
    async function loadDB() {
      try {
        const res = await fetch(`${API_BASE}/state`);
        if (!res.ok) throw new Error("Respuesta no válida del servidor");
        const state = await res.json();
        state.customerCredits = Array.isArray(state.customerCredits) ? state.customerCredits : [];
        state.customerPayments = Array.isArray(state.customerPayments) ? state.customerPayments : [];
        return state;
      } catch (e) {
        console.error("Error cargando BD desde MySQL:", e);
        return null;
      }
    }

    // Sube una imagen al backend y retorna una ruta relativa portable (images/archivo.png)
    async function uploadProductImage(file) {
      const formData = new FormData();
      formData.append("image", file, file.name);

      const res = await fetch(`${API_BASE}/upload-image`, {
        method: "POST",
        body: formData
      });

      if (!res.ok) {
        let detalle = "No se pudo subir la imagen";
        try {
          const errorPayload = await res.json();
          if (errorPayload?.error) detalle = errorPayload.error;
        } catch (_ignored) {
          // Mantener mensaje por defecto cuando el backend no responde JSON.
        }
        throw new Error(detalle);
      }

      const payload = await res.json();
      if (!payload?.path) {
        throw new Error("Respuesta inválida al subir la imagen");
      }

      return payload.path;
    }

    // Sube a MySQL un respaldo previamente guardado en localStorage (clave "mujermagicaDB")
    async function migrarDatosLocalStorage(saved) {
      try {
        const parsed = JSON.parse(saved);
        const res = await fetch(`${API_BASE}/migrate`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(parsed)
        });
        if (!res.ok) throw new Error("Error migrando datos");
        localStorage.setItem("mujermagicaDB_backup", saved);
        localStorage.removeItem("mujermagicaDB");
        showToast("Datos migrados a MySQL correctamente", "success");
        return true;
      } catch (e) {
        console.error("Error migrando datos a MySQL:", e);
        showToast("No se pudieron migrar los datos a MySQL", "danger");
        return false;
      }
    }

    const defaultProducts = [
      { id: "prod_001", nombre: "Shampoo Kativa", categoria: "Capilar", marca: "Kativa", precioVentaDetal: 29000, precioCompra: 14500, stockActual: 24, stockMinimo: 10, proveedor: "prov_001", imagen: "images/prod_001.png" },
      { id: "prod_002", nombre: "Acondicionador Wella", categoria: "Capilar", marca: "Wella", precioVentaDetal: 28000, precioCompra: 14000, stockActual: 20, stockMinimo: 8, proveedor: "prov_002", imagen: "images/prod_002.png" },
      { id: "prod_003", nombre: "Mantequilla Capilar", categoria: "Capilar", marca: "Milagros", precioVentaDetal: 36000, precioCompra: 18000, stockActual: 3, stockMinimo: 12, proveedor: "prov_001", imagen: "images/prod_003.png" },
      { id: "prod_004", nombre: "Sombras Premium", categoria: "Maquillaje", marca: "Loreal", precioVentaDetal: 39000, precioCompra: 19500, stockActual: 11, stockMinimo: 5, proveedor: "prov_002", imagen: "images/prod_004.png" },
      { id: "prod_005", nombre: "Brillos Labiales", categoria: "Maquillaje", marca: "Angelous", precioVentaDetal: 22000, precioCompra: 11000, stockActual: 2, stockMinimo: 15, proveedor: "prov_003", imagen: "images/prod_005.png" },
      { id: "prod_006", nombre: "Perfume Capilar", categoria: "Capilar", marca: "Alfaparf", precioVentaDetal: 26000, precioCompra: 13000, stockActual: 9, stockMinimo: 8, proveedor: "prov_003", imagen: "images/prod_006.png" },
      { id: "prod_007", nombre: "Polvo Compacto", categoria: "Maquillaje", marca: "CABA", precioVentaDetal: 34500, precioCompra: 17250, stockActual: 6, stockMinimo: 8, proveedor: "prov_001", imagen: "images/prod_007.png" },
      { id: "prod_008", nombre: "Repolarizador", categoria: "Capilar", marca: "Salvatore", precioVentaDetal: 48000, precioCompra: 24000, stockActual: 7, stockMinimo: 6, proveedor: "prov_002", imagen: "images/prod_008.png" }
    ];

    const defaultProviders = [
      { id: "prov_001", nombre: "Beauty Imports SA", telefono: "601-234-5678", email: "ventas@beautyimports.co", contacto: "Carlos Mendoza" },
      { id: "prov_002", nombre: "Cosmeticos Premium", telefono: "601-987-6543", email: "pedidos@cosmeticospremium.co", contacto: "Lucia Gomez" },
      { id: "prov_003", nombre: "Distribuciones Capilar", telefono: "601-555-9999", email: "compras@distcapilar.co", contacto: "Roberto Silva" }
    ];

    const defaultCustomers = [
      { id: "cli_001", nombre: "Mariana Gil", documento: "1023456789" },
      { id: "cli_002", nombre: "Diana Toro", documento: "52999887" }
    ];

    const defaultServices = [
      { id: "svc_alisado", nombre: "Alisado", precioSugerido: null, costoSugerido: null, activo: true },
      { id: "svc_terapia_capilar", nombre: "Terapia capilar", precioSugerido: null, costoSugerido: null, activo: true },
      { id: "svc_hidratacion", nombre: "Hidratación", precioSugerido: null, costoSugerido: null, activo: true },
      { id: "svc_henna", nombre: "Henna", precioSugerido: null, costoSugerido: null, activo: true },
      { id: "svc_lifting_pestanas", nombre: "Lifting de pestañas", precioSugerido: null, costoSugerido: null, activo: true }
    ];

    const generateDefaultSales = () => {
      const sales = [];
      for (let i = 0; i < 45; i++) {
        const daysAgo = Math.floor(Math.random() * 30);
        const date = new Date();
        date.setDate(date.getDate() - daysAgo);
        const productId = defaultProducts[Math.floor(Math.random() * defaultProducts.length)].id;
        const product = defaultProducts.find(p => p.id === productId);
        const cantidad = Math.floor(Math.random() * 5) + 1;
        const subtotal = cantidad * product.precioVentaDetal;
        const iva = 0;
        sales.push({
          id: uid("sale"),
          fecha: date.toISOString(),
          clienteId: Math.random() > 0.6 ? defaultCustomers[Math.floor(Math.random() * defaultCustomers.length)].id : null,
          items: [{ productId, cantidad, precio: product.precioVentaDetal }],
          subtotal,
          iva,
          total: subtotal,
          metodoPago: ["Efectivo", "Tarjeta", "Transferencia"][Math.floor(Math.random() * 3)]
        });
      }
      return sales;
    };

    const createDefaultDB = () => ({
      products: JSON.parse(JSON.stringify(defaultProducts)),
      providers: JSON.parse(JSON.stringify(defaultProviders)),
      customers: JSON.parse(JSON.stringify(defaultCustomers)),
      services: JSON.parse(JSON.stringify(defaultServices)),
      sales: generateDefaultSales(),
      customerCredits: [],
      customerPayments: [],
      purchases: [],
      movements: [],
      alerts: []
    });

    let db;

    // ==================== STATE ====================
    const appState = {
      currentRoute: "pos",
      searchTerm: "",
      cart: [],
      posTab: "productos",
      servicesTab: "catalogo",
      selectedPosServiceId: "",
      posBrandFilter: "",
      posCategoryFilter: "",
      historyMode: "all",
      historyDate: getLocalDateInputValue(new Date()),
      carteraCustomerId: "",
      periodo: `${new Date().getFullYear()}-${String(new Date().getMonth() + 1).padStart(2, "0")}`,
      activeAlerts: 0,
      birthdayCheckDate: "",
      birthdayAlerts: []
    };

    // ==================== FUNCIONES DE LÓGICA ====================
    function parseBirthDate(value) {
      if (typeof value !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return null;
      const date = new Date(`${value}T12:00:00`);
      return getLocalDateInputValue(date) === value ? date : null;
    }

    function getUpcomingBirthdays(customers, now = new Date()) {
      const todayKey = getLocalDateInputValue(now);
      const todayNumber = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
      return customers.flatMap(customer => {
        const birthDate = parseBirthDate(customer.fechaNacimiento);
        if (!birthDate || customer.fechaNacimiento > todayKey) return [];
        const anniversary = year => new Date(year, birthDate.getMonth(), Math.min(birthDate.getDate(), new Date(year, birthDate.getMonth() + 1, 0).getDate()));
        let nextBirthday = anniversary(now.getFullYear());
        let birthdayNumber = Date.UTC(nextBirthday.getFullYear(), nextBirthday.getMonth(), nextBirthday.getDate());
        if (birthdayNumber < todayNumber) {
          nextBirthday = anniversary(now.getFullYear() + 1);
          birthdayNumber = Date.UTC(nextBirthday.getFullYear(), nextBirthday.getMonth(), nextBirthday.getDate());
        }
        const daysUntil = (birthdayNumber - todayNumber) / 86400000;
        return daysUntil <= 7 ? [{ customerId: customer.id, nombre: customer.nombre, fecha: getLocalDateInputValue(nextBirthday), daysUntil }] : [];
      }).sort((first, second) => first.daysUntil - second.daysUntil || first.nombre.localeCompare(second.nombre));
    }

    function revisarCumpleanos(now = new Date(), force = false) {
      const dateKey = getLocalDateInputValue(now);
      if (!force && appState.birthdayCheckDate === dateKey) return false;
      appState.birthdayAlerts = getUpcomingBirthdays(db.customers, now);
      appState.birthdayCheckDate = dateKey;
      const count = document.getElementById("birthdayCount");
      if (count) count.textContent = appState.birthdayAlerts.length;
      const button = document.getElementById("birthdayBtn");
      if (button) button.setAttribute("aria-label", `Cumpleaños próximos: ${appState.birthdayAlerts.length}`);
      if (appState.birthdayAlerts.length) {
        try {
          const storageKey = "mujermagicaBirthdayNoticeDate";
          if (localStorage.getItem(storageKey) !== dateKey) {
            localStorage.setItem(storageKey, dateKey);
            showToast(`Cumpleaños próximos: ${appState.birthdayAlerts.length} clientes`, "info");
          }
        } catch (error) {
          console.warn("No se pudo registrar el aviso diario de cumpleaños", error);
        }
      }
      return true;
    }

    function startBirthdayChecks() {
      const check = () => {
        if (revisarCumpleanos()) renderView();
      };
      check();
      setInterval(check, 60000);
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) check();
      });
    }

    function renderBirthdayAlerts() {
      return appState.birthdayAlerts.map(alert => `<button type="button" onclick="openBirthdayCustomer('${escapeHtml(alert.customerId)}')" class="w-full flex items-center justify-between gap-3 border-b px-3 py-3 text-left hover:bg-teal-50"><span class="min-w-0 break-words font-semibold">${escapeHtml(alert.nombre)}</span><span class="shrink-0 text-right text-sm text-teal-800">${alert.fecha.split("-").reverse().join("/")}<br>${alert.daysUntil === 0 ? "Hoy" : `En ${alert.daysUntil} ${alert.daysUntil === 1 ? "día" : "días"}`}</span></button>`).join("") || '<p class="py-6 text-center text-sm text-slate-500">Sin cumpleaños próximos</p>';
    }

    function showBirthdayAlertsModal() {
      revisarCumpleanos();
      document.getElementById("modalContent").innerHTML = `<div class="modal-content"><div class="modal-header flex items-center justify-between gap-3"><h3 class="text-lg font-bold">Cumpleaños próximos</h3><button type="button" onclick="cerrarModal()" title="Cerrar" aria-label="Cerrar" class="h-8 w-8 shrink-0 rounded-md hover:bg-slate-100">&times;</button></div><div class="modal-body">${renderBirthdayAlerts()}</div></div>`;
      document.getElementById("modalBackdrop").classList.add("active");
    }

    function openBirthdayCustomer(customerId) {

      appState.searchTerm = "";
      document.getElementById("globalSearch").value = "";
      cambiarRuta("clientes");

    }

    function calcularAlertas() {
      db.alerts = [];
      db.products.forEach(p => {
        if (p.stockActual < p.stockMinimo) {
          db.alerts.push({
            id: uid("alert"),
            productId: p.id,
            tipo: p.stockActual === 0 ? "critico" : "bajo",
            mensaje: `${p.nombre} stock: ${p.stockActual}/${p.stockMinimo}`,
            fecha: today
          });
        }
      });
      appState.activeAlerts = db.alerts.filter(a => a.tipo === "critico").length;
      document.querySelector(".alert-count").textContent = appState.activeAlerts;
    }

    function getEstadoStock(producto) {
      const pct = (producto.stockActual / producto.stockMinimo) * 100;
      if (pct >= 100) return { clase: "status-optimal", estado: "ÓPTIMO", color: "text-emerald-700" };
      if (pct >= 50) return { clase: "status-warning", estado: "BAJO", color: "text-amber-700" };
      return { clase: "status-critical", estado: "CRÍTICO", color: "text-red-700" };
    }

    function filterSalesByPeriod(sales, periodo) {
      const now = new Date();
      const monthlyPeriod = /^(\d{4})-(0[1-9]|1[0-2])$/.exec(periodo);
      return sales.filter(sale => {
        const saleDate = new Date(sale.fecha);
        if (periodo === "todo") return true;
        if (monthlyPeriod) return saleDate.getFullYear() === Number(monthlyPeriod[1]) && saleDate.getMonth() + 1 === Number(monthlyPeriod[2]);
        if (periodo === "30") return (now - saleDate) / (1000 * 60 * 60 * 24) <= 30;
        if (periodo === "7") return (now - saleDate) / (1000 * 60 * 60 * 24) <= 7;
        if (periodo === "1") return saleDate.toDateString() === now.toDateString();
        return true;
      });
    }

    function renderPeriodSelector(st) {
      const currentYear = new Date().getFullYear();
      const years = st.sales.map(sale => new Date(sale.fecha).getFullYear()).filter(Number.isFinite);
      const firstYear = Math.min(currentYear, ...years);
      const lastYear = Math.max(currentYear, ...years);
      const formatter = new Intl.DateTimeFormat("es-CO", { month: "long", year: "numeric" });
      const options = [];
      for (let year = lastYear; year >= firstYear; year--) {
        for (let month = 12; month >= 1; month--) {
          const value = `${year}-${String(month).padStart(2, "0")}`;
          const label = formatter.format(new Date(year, month - 1, 1));
          options.push(`<option value="${value}" ${appState.periodo === value ? "selected" : ""}>${label}</option>`);
        }
      }
      return `<div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between"><label for="periodoMes" class="text-sm font-semibold">Per&iacute;odo de ventas</label><select id="periodoMes" onchange="setMonthlyPeriod(this.value)" class="w-full sm:w-64 rounded-lg border px-3 py-2 text-sm bg-white">${options.join("")}<option value="todo" ${appState.periodo === "todo" ? "selected" : ""}>Todo el historial</option></select></div>`;
    }

    function setMonthlyPeriod(periodo) {
      if (periodo !== "todo" && !/^\d{4}-(0[1-9]|1[0-2])$/.test(periodo)) return;
      appState.periodo = periodo;
      renderView();
    }

    function calcularMetricasGenerales(sales) {
      const totalVentas = sales.reduce((s, sale) => s + sale.total, 0);
      const items = sales.flatMap(sale => sale.items);
      const productos = items.filter(item => item.tipo !== "servicio");
      const servicios = items.filter(item => item.tipo === "servicio");
      const ingresosProductos = productos.reduce((sum, item) => sum + item.cantidad * item.precio, 0);
      const ingresosServicios = servicios.reduce((sum, item) => sum + item.cantidad * item.precio, 0);
      const totalCostoProductos = productos.reduce((sum, item) => sum + item.cantidad * (db.products.find(product => product.id === item.productId)?.precioCompra ?? 0), 0);
      const totalCosto = totalCostoProductos + servicios.reduce((sum, item) => sum + item.cantidad * (item.costo ?? 0), 0);
      const serviciosSinCosto = servicios.filter(item => item.costo == null).reduce((sum, item) => sum + item.cantidad, 0);
      const ingresosSinCosto = servicios.filter(item => item.costo == null).reduce((sum, item) => sum + item.cantidad * item.precio, 0);
      const gananciaBruta = totalVentas - totalCosto - ingresosSinCosto;
      const ingresosConCosto = totalVentas - ingresosSinCosto;
      const margenPromedio = ingresosConCosto > 0 ? (gananciaBruta / ingresosConCosto) * 100 : 0;
      const cantVentas = sales.length;
      const ventaPromedio = cantVentas > 0 ? totalVentas / cantVentas : 0;
      return { totalVentas, totalCosto, totalCostoProductos, ingresosProductos, ingresosServicios, serviciosSinCosto, gananciaBruta, margenPromedio, cantVentas, ventaPromedio };
    }

    function productosMasVendidos(sales, limite = 5) {
      const productMap = {};
      sales.forEach(sale => {
        sale.items.forEach(item => {
          if (item.tipo === "servicio") return;
          if (!productMap[item.productId]) productMap[item.productId] = { cantidad: 0, ventas: 0, costo: 0 };
          productMap[item.productId].cantidad += item.cantidad;
          productMap[item.productId].ventas += item.cantidad * item.precio;
          productMap[item.productId].costo += item.cantidad * (db.products.find(p => p.id === item.productId)?.precioCompra ?? 0);
        });
      });
      return Object.entries(productMap).map(([productId, data]) => {
        const product = db.products.find(p => p.id === productId);
        return { ...product, ...data, ganancia: data.ventas - data.costo, margen: ((data.ventas - data.costo) / data.ventas) * 100 };
      }).sort((a, b) => b.cantidad - a.cantidad).slice(0, limite);
    }

    function clientesMasActivos(sales, limite = 5) {
      const clientMap = {};
      sales.forEach(sale => {
        if (sale.clienteId) {
          if (!clientMap[sale.clienteId]) clientMap[sale.clienteId] = { compras: 0, total: 0 };
          clientMap[sale.clienteId].compras += 1;
          clientMap[sale.clienteId].total += sale.total;
        }
      });
      return Object.entries(clientMap).map(([clienteId, data]) => {
        const customer = db.customers.find(c => c.id === clienteId);
        return { ...customer, ...data, promedioCompra: data.total / data.compras };
      }).sort((a, b) => b.total - a.total).slice(0, limite);
    }

    // ==================== RENDERIZADO ====================
    function renderDashboard(st, search = "") {
      calcularAlertas();
      const conAlerta = st.products.filter(p => p.stockActual < p.stockMinimo);
      const stockBajo = st.products.filter(p => p.stockActual < p.stockMinimo).length;
      const stockCritico = st.products.filter(p => p.stockActual === 0).length;
      const valorInventario = st.products.reduce((s, p) => s + (p.stockActual * p.precioCompra), 0);
      const inversionAcumulada = valorInventario + calcularMetricasGenerales(st.sales).totalCostoProductos;
      const metricas = calcularMetricasGenerales(filterSalesByPeriod(st.sales, appState.periodo));

      const alertCards = conAlerta.slice(0, 6).map(p => {
        const estado = getEstadoStock(p);
        return `
          <div class="status-card ${estado.clase}">
            <div class="flex justify-between items-start mb-1">
              <div><p class="font-semibold text-sm">${p.nombre}</p><p class="text-xs text-slate-600">${p.marca}</p></div>
              <span class="stock-badge ${estado.color === 'text-emerald-700' ? 'bg-emerald-100 text-emerald-700' : estado.color === 'text-amber-700' ? 'bg-amber-100 text-amber-700' : 'bg-red-100 text-red-700'}">${estado.estado}</span>
            </div>
            <div class="flex justify-between text-sm mb-2"><span class="font-semibold">Stock: ${p.stockActual}</span><span class="text-slate-600">Min: ${p.stockMinimo}</span></div>
          </div>
        `;
      }).join("");

      return `
        ${renderPeriodSelector(st)}
        <div class="grid grid-cols-1 gap-4 md:grid-cols-4">
          <div class="kpi-card"><p class="text-xs uppercase text-slate-500">Total vendido</p><p class="mt-2 text-2xl font-bold">${formatCurrency(metricas.totalVentas)}</p></div>
          <div class="kpi-card"><p class="text-xs uppercase text-slate-500">Stock bajo</p><p class="mt-2 text-2xl font-bold text-amber-700">${stockBajo}</p><p class="text-xs text-slate-500 mt-1">Actual</p></div>
          <div class="kpi-card"><p class="text-xs uppercase text-slate-500">${metricas.serviciosSinCosto ? "Ganancia conocida" : "Ganancia"}</p><p class="mt-2 text-2xl font-bold metric-up">${formatCurrency(metricas.gananciaBruta)}</p>${metricas.serviciosSinCosto ? `<p class="text-xs text-amber-700 mt-1">${metricas.serviciosSinCosto} servicios sin costo registrado</p>` : ""}</div>
          <div class="kpi-card"><p class="text-xs uppercase text-slate-500">Inversi&oacute;n acumulada</p><p class="mt-2 text-2xl font-bold">${formatCurrency(inversionAcumulada)}</p><p class="text-xs text-slate-500 mt-1">Estimado hist&oacute;rico a costo actual</p></div>
        </div>
        <div class="view-card"><h3 class="text-lg font-bold mb-3">⚠️ Alertas de stock</h3><div class="space-y-2">${alertCards || '<p class="text-sm text-slate-500 text-center py-4">Sin alertas</p>'}</div></div>
      `;
    }

    function renderProductos(st, search = "") {
      const criteria = search.toLowerCase();
      const filtered = st.products.filter(p => !criteria || `${p.nombre} ${p.codigoBarras || ""}`.toLowerCase().includes(criteria));
      const rows = filtered.map(p => {
        const estado = getEstadoStock(p);
        const isActive = p.activo !== false;
        return `<tr class="border-b text-sm hover:bg-slate-50"><td class="break-words px-3 py-2 font-semibold">${escapeHtml(p.nombre)}</td><td class="px-3 py-2 font-mono text-xs">${escapeHtml(p.codigoBarras || "-")}</td><td class="px-3 py-2">${escapeHtml(p.marca || "-")}</td><td class="px-3 py-2 text-right">${formatCurrency(p.precioVentaDetal)}</td><td class="px-3 py-2 text-right">${formatCurrency(p.precioCompra)}</td><td class="px-3 py-2 text-right">${p.stockActual}</td><td class="px-3 py-2"><div class="flex flex-col items-start gap-1"><span class="stock-badge ${estado.color === 'text-emerald-700' ? 'bg-emerald-100 text-emerald-700' : estado.color === 'text-amber-700' ? 'bg-amber-100 text-amber-700' : 'bg-red-100 text-red-700'}">${estado.estado}</span><span class="text-xs ${isActive ? "text-emerald-700" : "text-slate-500"}">${isActive ? "Activo" : "Inactivo"}</span></div></td><td class="px-3 py-2"><div class="flex items-center justify-center gap-1"><button type="button" aria-label="Editar ${escapeHtml(p.nombre)}" title="Editar producto" onclick="showEditProductModal('${escapeHtml(p.id)}')" class="inline-flex h-8 w-8 items-center justify-center rounded-md text-sm text-slate-600 hover:bg-slate-100 hover:text-slate-900">✏️</button><button type="button" aria-label="${isActive ? "Desactivar" : "Activar"} ${escapeHtml(p.nombre)}" title="${isActive ? "Desactivar producto" : "Activar producto"}" onclick="setProductActive('${escapeHtml(p.id)}', ${!isActive})" class="inline-flex h-8 w-8 items-center justify-center rounded-md text-sm ${isActive ? "text-teal-700 hover:bg-teal-50" : "text-emerald-700 hover:bg-emerald-50"}">⏻</button><button type="button" aria-label="Eliminar ${escapeHtml(p.nombre)}" title="Eliminar producto" onclick="eliminarProducto('${escapeHtml(p.id)}')" class="inline-flex h-8 w-8 items-center justify-center rounded-md text-sm text-red-700 hover:bg-red-50">🗑️</button></div></td></tr>`;
      }).join("");
      return `<div class="view-card"><div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between mb-4"><div><h3 class="text-lg font-bold">📦 Catálogo de productos</h3><p class="text-sm text-slate-500">Alta y edición de productos</p></div><button type="button" onclick="showEditProductModal()" class="rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white">+ Nuevo producto</button></div><div class="overflow-x-auto rounded-xl border bg-white"><table class="w-full min-w-[1100px] table-fixed text-sm"><thead class="bg-slate-50 text-xs uppercase border-b"><tr><th class="w-[20%] px-3 py-2 text-left">Producto</th><th class="w-[16%] px-3 py-2 text-left">Código de barras</th><th class="w-[12%] px-3 py-2 text-left">Marca</th><th class="w-[13%] px-3 py-2 text-right">P. Venta</th><th class="w-[13%] px-3 py-2 text-right">P. Compra</th><th class="w-[7%] px-3 py-2 text-right">Stock</th><th class="w-[10%] px-3 py-2 text-left">Estado</th><th class="w-[9%] px-3 py-2 text-center">Acción</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
    }

    function renderProveedores(st, search = "") {

      const rows = filtered.map(provider => {
        const productosAsignados = st.products.filter(p => p.proveedor === provider.id).length;
        const stockTotal = st.products.filter(p => p.proveedor === provider.id).reduce((s, p) => s + p.stockActual, 0);
        const isActive = provider.activo !== false;
        const providerId = escapeHtml(provider.id);
        const providerName = escapeHtml(provider.nombre);
        return `<tr class="border-b text-sm hover:bg-slate-50"><td class="px-3 py-2 font-semibold">${providerName}</td><td class="px-3 py-2">${escapeHtml(provider.contacto || "---")}</td><td class="px-3 py-2">${escapeHtml(provider.telefono || "---")}</td><td class="px-3 py-2">${escapeHtml(provider.email || "---")}</td><td class="px-3 py-2 text-right">${productosAsignados}</td><td class="px-3 py-2 text-right">${stockTotal}</td><td class="px-3 py-2"><span class="rounded-full px-2 py-1 text-xs ${isActive ? "bg-emerald-100 text-emerald-700" : "bg-slate-100 text-slate-600"}">${isActive ? "Activo" : "Inactivo"}</span></td><td class="px-3 py-2"><div class="flex items-center justify-center gap-1"><button type="button" aria-label="Editar ${providerName}" title="Editar proveedor" onclick="showEditProviderModal('${providerId}')" class="inline-flex h-8 w-8 items-center justify-center rounded-md text-sm text-slate-600 hover:bg-slate-100 hover:text-slate-900">✏️</button><button type="button" aria-label="${isActive ? "Desactivar" : "Activar"} ${providerName}" title="${isActive ? "Desactivar proveedor" : "Activar proveedor"}" onclick="setProviderActive('${providerId}', ${!isActive})" class="inline-flex h-8 w-8 items-center justify-center rounded-md text-sm ${isActive ? "text-teal-700 hover:bg-teal-50" : "text-emerald-700 hover:bg-emerald-50"}">⏻</button><button type="button" aria-label="Eliminar ${providerName}" title="Eliminar proveedor" onclick="eliminarProveedor('${providerId}')" class="inline-flex h-8 w-8 items-center justify-center rounded-md text-sm text-red-700 hover:bg-red-50">🗑️</button></div></td></tr>`;
      }).join("");

      return `
        <div class="view-card mb-4">
          <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
            <div>
              <h3 class="text-lg font-bold">🏢 Proveedores</h3>
              <p class="text-sm text-slate-500">Alta, edición y seguimiento de proveedores</p>
            </div>
            <button type="button" onclick="showEditProviderModal()" class="rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white">+ Nuevo proveedor</button>
          </div>

        <div class="view-card"><div class="overflow-x-auto rounded-xl border bg-white"><table class="min-w-full text-sm"><thead class="bg-slate-50 text-xs uppercase border-b"><tr><th class="px-3 py-2 text-left">Proveedor</th><th class="px-3 py-2 text-left">Contacto</th><th class="px-3 py-2 text-left">Teléfono</th><th class="px-3 py-2 text-left">Correo</th><th class="px-3 py-2 text-right">Productos</th><th class="px-3 py-2 text-right">Stock</th><th class="px-3 py-2 text-left">Estado</th><th class="px-3 py-2 text-center">Acción</th></tr></thead><tbody>${rows || '<tr><td colspan="8" class="px-3 py-4 text-center text-slate-500">Sin proveedores</td></tr>'}</tbody></table></div></div>
      `;
    }

    function providerTieneHistorial(providerId) {
      return db.products.some(product => product.proveedor === providerId)
        || db.purchases.some(purchase => purchase.proveedorId === providerId)
        || db.movements.some(movement => movement.proveedorId === providerId);
    }

    async function setProviderActive(providerId, active) {
      const provider = db.providers.find(entry => entry.id === providerId);
      if (!provider || (provider.activo !== false) === active) return;
      const previousState = provider.activo;
      provider.activo = active;
      if (!await saveDB()) {
        provider.activo = previousState;
        return;
      }
      showToast(active ? "Proveedor activado" : "Proveedor desactivado", "success");
      renderView();
    }

    async function eliminarProveedor(providerId) {
      const providerIndex = db.providers.findIndex(entry => entry.id === providerId);
      if (providerIndex === -1) return;
      const provider = db.providers[providerIndex];
      if (providerTieneHistorial(providerId)) {
        showToast("No se puede eliminar: el proveedor tiene productos o movimientos asociados. Desactívalo para conservar el historial.", "warning");
        return;
      }
      if (!confirm(`¿Eliminar el proveedor ${provider.nombre}? Esta acción no se puede deshacer.`)) return;

      db.providers.splice(providerIndex, 1);
      if (!await saveDB()) {
        db.providers.splice(providerIndex, 0, provider);
        return;
      }
      showToast("Proveedor eliminado", "success");
      renderView();
    }

            <div>
              <label class="block text-sm font-semibold mb-1">Nombre</label>
              <input type="text" id="providerName" value="${provider?.nombre || ""}" class="w-full px-3 py-2 border rounded-lg text-sm" required />
            </div>
            <div>
              <label class="block text-sm font-semibold mb-1">Contacto</label>

              </div>
              <div>
                <label class="block text-sm font-semibold mb-1">Correo</label>
                <input type="email" id="providerEmail" value="${provider?.email || ""}" class="w-full px-3 py-2 border rounded-lg text-sm" />
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" id="btnCancelProvider" class="flex-1 rounded-lg border px-3 py-2 text-sm font-semibold">Cancelar</button>
          <button type="submit" form="providerForm" class="flex-1 rounded-lg bg-slate-900 px-3 py-2 text-sm font-semibold text-white">Guardar</button>
        </div>
      `;
      document.getElementById("modalContent").innerHTML = "";
      document.getElementById("modalContent").appendChild(div);
      document.getElementById("modalBackdrop").classList.add("active");

      document.getElementById("btnCancelProvider").addEventListener("click", cerrarModal);
      document.getElementById("providerForm").addEventListener("submit", e => {
        e.preventDefault();
        const nombre = document.getElementById("providerName").value.trim();
        const contacto = document.getElementById("providerContact").value.trim();
        const telefono = document.getElementById("providerPhone").value.trim();
        const email = document.getElementById("providerEmail").value.trim();
        if (!nombre || !contacto) {
          showToast("Completa nombre y contacto", "warning");
          return;
        }

        if (isNew) {
          db.providers.push({ id: uid("prov"), nombre, contacto, telefono, email });
          showToast("Proveedor creado", "success");
          saveDB();
        } else {
          provider.nombre = nombre;
          provider.contacto = contacto;
          provider.telefono = telefono;
          provider.email = email;
          showToast("Proveedor actualizado", "success");

        e.preventDefault();
        const nombre = document.getElementById("customerName").value.trim();
        const documento = document.getElementById("customerDoc").value.trim();
        const telefono = document.getElementById("customerPhone").value.trim();
        const correo = document.getElementById("customerEmail").value.trim();
        const fechaNacimiento = document.getElementById("customerBirthDate").value || null;
        if (!nombre || !documento) {
          showToast("Completa nombre y documento", "warning");
          return;
        }
        if (fechaNacimiento && (!parseBirthDate(fechaNacimiento) || fechaNacimiento > getLocalDateInputValue(new Date()))) {
          showToast("Ingresa una fecha de nacimiento válida que no sea futura", "warning");
          return;
        }

        const previousCustomers = JSON.parse(JSON.stringify(db.customers));
        if (isNew) {
          db.customers.push({ id: uid("cli"), nombre, documento, telefono, correo, fechaNacimiento });
        } else {
          Object.assign(db.customers.find(entry => entry.id === customerId), { nombre, documento, telefono, correo, fechaNacimiento });

        if (!await saveDB()) {
          db.customers = previousCustomers;

        revisarCumpleanos(new Date(), true);

    function renderClientes(st, search = "") {
      const criteria = search.toLowerCase();
      const filtered = st.customers.filter(c => !criteria || `${c.nombre} ${c.documento} ${c.telefono || ""} ${c.correo || ""}`.toLowerCase().includes(criteria));
      const rows = filtered.map(c => {
        const ventas = st.sales.filter(s => s.clienteId === c.id).length;
        const totalComprado = st.sales.filter(s => s.clienteId === c.id).reduce((sum, s) => sum + s.total, 0);
        const birthday = appState.birthdayAlerts.find(alert => alert.customerId === c.id);
        return `
          <tr class="border-b text-sm hover:bg-slate-50">
            <td class="px-3 py-2 font-semibold">${escapeHtml(c.nombre)}${birthday ? `<button type="button" title="Abrir cliente por cumpleaños" aria-label="Cumpleaños de ${escapeHtml(c.nombre)}" onclick="openBirthdayCustomer('${escapeHtml(c.id)}')" class="ml-2 inline-flex items-center gap-1 text-xs text-teal-800"><span aria-hidden="true">&#128276;</span>${birthday.daysUntil === 0 ? "Hoy" : `En ${birthday.daysUntil} días`}</button>` : ""}</td>

            <td class="px-3 py-2 whitespace-nowrap">${parseBirthDate(c.fechaNacimiento) ? c.fechaNacimiento.split("-").reverse().join("/") : "---"}</td>
            <td class="px-3 py-2 text-right">${ventas}</td>
            <td class="px-3 py-2 text-right">${formatCurrency(totalComprado)}</td>
            <td class="px-3 py-2"><div class="flex items-center justify-center gap-1"><button type="button" aria-label="Editar ${escapeHtml(c.nombre)}" title="Editar cliente" onclick="showEditCustomerModal('${escapeHtml(c.id)}')" class="inline-flex h-8 w-8 items-center justify-center rounded-md text-sm text-slate-600 hover:bg-slate-100 hover:text-slate-900">✏️</button><button type="button" aria-label="Eliminar ${escapeHtml(c.nombre)}" title="Eliminar cliente" onclick="eliminarCliente('${escapeHtml(c.id)}')" class="inline-flex h-8 w-8 items-center justify-center rounded-md text-sm text-red-700 hover:bg-red-50">🗑️</button></div></td>

            <div>

        <div class="view-card">
          <div class="overflow-x-auto rounded-xl border bg-white">
            <table class="min-w-full text-sm">
              <thead class="bg-slate-50 text-xs uppercase border-b">
                <tr><th class="px-3 py-2 text-left">Nombre</th><th class="px-3 py-2 text-left">Documento</th><th class="px-3 py-2 text-left">Teléfono</th><th class="px-3 py-2 text-left">Correo</th><th class="px-3 py-2 text-left">Nacimiento</th><th class="px-3 py-2 text-right">Ventas</th><th class="px-3 py-2 text-right">Total comprado</th><th class="px-3 py-2 text-center">Acción</th></tr>
              </thead>
              <tbody>${rows || '<tr><td colspan="8" class="px-3 py-4 text-center text-slate-500">Sin clientes</td></tr>'}</tbody>

    async function eliminarCliente(customerId) {
      const customerIndex = db.customers.findIndex(customer => customer.id === customerId);
      if (customerIndex === -1) return;
      const customer = db.customers[customerIndex];
      if (db.sales.some(sale => sale.clienteId === customerId)) {
        showToast("No se puede eliminar: el cliente tiene ventas asociadas. Se conserva para proteger el historial.", "warning");
        return;
      }
      if (!confirm(`¿Eliminar el cliente ${customer.nombre}? Esta acción no se puede deshacer.`)) return;

      db.customers.splice(customerIndex, 1);
      if (!await saveDB()) {
        db.customers.splice(customerIndex, 0, customer);
        return;
      }
      showToast("Cliente eliminado", "success");
      revisarCumpleanos(new Date(), true);
      renderView();
    }

      document.getElementById("btnCancelProduct").addEventListener("click", () => {

      });

      const imageUploadInput = document.getElementById("productImageUpload");
      if (imageUploadInput) {
        imageUploadInput.addEventListener("change", (e) => {
          const file = e.target.files[0];
          if (file) {
            pendingImageFile = file;
            const previewUrl = URL.createObjectURL(file);
            const preview = document.getElementById("imagePreview");
            preview.innerHTML = `<img src="${previewUrl}" alt="preview" style="max-width: 100px; border-radius: 8px;">`;
          }
        });
      }

      document.getElementById("productForm").addEventListener("submit", async e => {

        const name = document.getElementById("productName").value.trim();
        const category = document.getElementById("productCategory").value;
        const brand = document.getElementById("productBrand").value.trim();
        const codigoBarras = document.getElementById("productBarcode").value.trim();
        const priceBuy = Number(document.getElementById("productPriceBuy").value);
        const priceSell = Number(document.getElementById("productPriceSell").value);
        const wholesalePriceInput = document.getElementById("productPriceWholesale").value.trim();
        const wholesalePrice = wholesalePriceInput === "" ? null : Number(wholesalePriceInput);
        const stock = Number(document.getElementById("productStock").value);
        const stockMinimo = Number(document.getElementById("productMinStock").value);
        const providerId = document.getElementById("productProvider").value;
        let image = document.getElementById("productImage").value.trim();

        if (pendingImageFile) {
          try {
            image = await uploadProductImage(pendingImageFile);
            document.getElementById("productImage").value = image;
          } catch (err) {
            console.error("Error subiendo imagen:", err);
            showToast(`No se pudo subir la imagen: ${err.message}`, "danger");
            return;
          }
        }

        if (image.startsWith("data:image/")) {
          showToast("Selecciona una imagen para guardarla en la carpeta images.", "warning");
          return;
        }
        
        // Si no hay imagen definida, usar un placeholder ya ubicado en images.
        if (!image) {
          image = "images/shampoo_cebolla.jpg";
        }

        if (!name || !category || !brand || Number.isNaN(priceBuy) || Number.isNaN(priceSell) || (wholesalePrice !== null && (!Number.isFinite(wholesalePrice) || wholesalePrice <= 0))) {
          showToast("Completa los campos obligatorios", "warning");
          return;
        }

        const normalizedBarcode = codigoBarras.toLocaleLowerCase();
        const duplicateBarcode = normalizedBarcode && db.products.some(entry => entry.id !== product?.id && String(entry.codigoBarras || "").trim().toLocaleLowerCase() === normalizedBarcode);
        if (duplicateBarcode) {
          showToast("Ese código de barras ya está asignado a otro producto", "warning");
          return;
        }

        if (isNew) {
          db.products.push({
            id: uid("prod"),
            nombre: name,
            categoria: category,
            marca: brand,
            codigoBarras: codigoBarras || null,
            proveedor: providerId,
            imagen: image,
            precioCompra: priceBuy,
            precioVentaDetal: priceSell,
            precioVentaMayorista: wholesalePrice,
            activo: true,
            stockActual: stock,
            stockMinimo,
            fechaIngreso: today
          });
          showToast("Producto creado", "success");
          saveDB();
        } else {
          product.nombre = name;
          product.categoria = category;
          product.marca = brand;
          product.codigoBarras = codigoBarras || null;
          product.proveedor = providerId;
          product.imagen = image;
          product.precioCompra = priceBuy;
          product.precioVentaDetal = priceSell;
          product.precioVentaMayorista = wholesalePrice;
          product.stockActual = stock;
          product.stockMinimo = stockMinimo;
          showToast("Producto actualizado", "success");
          saveDB();
        }

        document.getElementById("modalBackdrop").classList.remove("active");
        renderView();
      });
    }

    function renderServicios(st, search = "") {
      const servicesByName = new Map();
      (st.services || []).forEach(service => {
        const key = service.nombre.trim().toLocaleLowerCase("es-CO");
        const current = servicesByName.get(key);
        if (!current || (current.activo === false && service.activo !== false)) servicesByName.set(key, service);
      });
      const services = [...servicesByName.values()].filter(service => service.nombre.toLowerCase().includes(search.toLowerCase()));
      const rows = services.map(service => `<tr class="border-b text-sm"><td class="px-3 py-2 font-semibold">${escapeHtml(service.nombre)}</td><td class="px-3 py-2 text-right">${service.precioSugerido == null ? "Variable" : formatCurrency(service.precioSugerido)}</td><td class="px-3 py-2 text-right">${service.costoSugerido == null ? "Sin registrar" : formatCurrency(service.costoSugerido)}</td><td class="px-3 py-2">${service.activo !== false ? "Activo" : "Inactivo"}</td><td class="px-3 py-2"><button type="button" data-id="${escapeHtml(service.id)}" onclick="showEditServiceModal(this.dataset.id)" class="font-semibold text-slate-700">Editar</button></td></tr>`).join("");
      const historyRows = st.sales.flatMap(sale => sale.items.filter(item => item.tipo === "servicio").map(item => {
        const customer = sale.clienteId ? st.customers.find(entry => entry.id === sale.clienteId) : null;
        return { sale, item, customer };
      })).filter(({ sale, item, customer }) => !search || `${sale.id} ${customer?.nombre || "Consumidor"} ${item.nombre} ${item.observaciones || ""} ${sale.metodoPago || ""}`.toLowerCase().includes(search.toLowerCase())).sort((left, right) => new Date(right.sale.fecha) - new Date(left.sale.fecha));
      const historyTableRows = historyRows.map(({ sale, item, customer }) => `<tr class="border-b text-sm"><td class="px-3 py-2 whitespace-nowrap">${formatDate(sale.fecha)}</td><td class="px-3 py-2"><button type="button" data-sale-id="${escapeHtml(sale.id)}" onclick="verFactura(this.dataset.saleId)" class="font-semibold text-teal-700">${escapeHtml(sale.id)}</button></td><td class="px-3 py-2">${escapeHtml(customer?.nombre || "Consumidor")}</td><td class="px-3 py-2 font-semibold">${escapeHtml(item.nombre)}</td><td class="px-3 py-2 text-right">${item.cantidad}</td><td class="px-3 py-2 text-right">${formatCurrency(item.precio * item.cantidad)}</td><td class="px-3 py-2">${escapeHtml(item.observaciones || "-")}</td><td class="px-3 py-2">${escapeHtml(sale.metodoPago || "-")}</td></tr>`).join("");
      const tabs = `<div role="tablist" aria-label="Sección de servicios" class="flex flex-wrap border-b mb-4"><button type="button" role="tab" aria-selected="${appState.servicesTab === "catalogo"}" onclick="setServicesTab('catalogo')" class="px-4 py-2 text-sm font-semibold ${appState.servicesTab === "catalogo" ? "border-b-2 border-teal-700 text-teal-700" : "text-slate-500"}">Cat&aacute;logo</button><button type="button" role="tab" aria-selected="${appState.servicesTab === "historial"}" onclick="setServicesTab('historial')" class="px-4 py-2 text-sm font-semibold ${appState.servicesTab === "historial" ? "border-b-2 border-teal-700 text-teal-700" : "text-slate-500"}">Historial de realizados <span class="ml-1 text-xs">${historyRows.length}</span></button></div>`;
      const content = appState.servicesTab === "historial"
        ? `<div class="overflow-x-auto border rounded-lg"><table class="min-w-full"><thead class="bg-slate-50 text-xs uppercase"><tr><th class="px-3 py-2 text-left">Fecha</th><th class="px-3 py-2 text-left">Ticket</th><th class="px-3 py-2 text-left">Cliente</th><th class="px-3 py-2 text-left">Procedimiento</th><th class="px-3 py-2 text-right">Cant.</th><th class="px-3 py-2 text-right">Valor</th><th class="px-3 py-2 text-left">Observaciones</th><th class="px-3 py-2 text-left">Pago</th></tr></thead><tbody>${historyTableRows || '<tr><td colspan="8" class="px-3 py-6 text-center text-sm text-slate-500">A&uacute;n no hay servicios realizados</td></tr>'}</tbody></table></div>`
        : `<div class="flex flex-wrap items-center justify-between gap-3 mb-4"><div><h3 class="text-lg font-bold">Cat&aacute;logo de servicios</h3><p class="text-sm text-slate-500">Agrega procedimientos; el precio se acuerda en cada venta.</p></div><button type="button" onclick="showEditServiceModal()" class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-semibold text-white">+ Nuevo servicio</button></div><div class="overflow-x-auto border rounded-lg"><table class="min-w-full"><thead class="bg-slate-50 text-xs uppercase"><tr><th class="px-3 py-2 text-left">Procedimiento</th><th class="px-3 py-2 text-right">Precio sugerido</th><th class="px-3 py-2 text-right">Costo sugerido</th><th class="px-3 py-2 text-left">Estado</th><th class="px-3 py-2 text-left">Acci&oacute;n</th></tr></thead><tbody>${rows || '<tr><td colspan="5" class="px-3 py-6 text-center text-sm text-slate-500">Sin servicios registrados</td></tr>'}</tbody></table></div>`;
      return `<div class="view-card">${tabs}${content}</div>`;
    }

    function setServicesTab(tab) {
      if (!["catalogo", "historial"].includes(tab)) return;
      appState.servicesTab = tab;
      renderView();
    }

    function showServiceForm(title, fields, submitLabel, onSubmit) {
      const form = document.createElement("form");
      form.className = "modal-content";
      form.innerHTML = `<div class="modal-header"><h3 class="text-lg font-bold">${escapeHtml(title)}</h3></div><div class="modal-body space-y-3">${fields}</div><div class="modal-footer"><button type="button" onclick="cerrarModal()" class="flex-1 border rounded-lg px-3 py-2">Cancelar</button><button type="submit" class="flex-1 bg-slate-900 text-white rounded-lg px-3 py-2">${submitLabel}</button></div>`;
      form.addEventListener("submit", async event => {
        event.preventDefault();
        const button = form.querySelector('[type="submit"]');
        button.disabled = true;
        try { await onSubmit(form); } finally { button.disabled = false; }
      });
      document.getElementById("modalContent").replaceChildren(form);
      document.getElementById("modalBackdrop").classList.add("active");
    }

    function showEditServiceModal(serviceId) {
      const service = (db.services || []).find(entry => entry.id === serviceId);
      showServiceForm(service ? "Editar servicio" : "Nuevo servicio", `
        <div><label for="serviceName" class="block text-sm font-semibold mb-1">Procedimiento</label><input id="serviceName" name="nombre" value="${escapeHtml(service?.nombre)}" maxlength="150" required class="w-full border rounded-lg px-3 py-2" /></div>
        <div><label for="servicePrice" class="block text-sm font-semibold mb-1">Precio sugerido (opcional)</label><input id="servicePrice" name="precio" type="number" min="0" max="9999999999.99" step="0.01" value="${service?.precioSugerido ?? ""}" class="w-full border rounded-lg px-3 py-2" /></div>
        <div><label for="serviceCost" class="block text-sm font-semibold mb-1">Costo directo sugerido (opcional)</label><input id="serviceCost" name="costo" type="number" min="0" max="9999999999.99" step="0.01" value="${service?.costoSugerido ?? ""}" class="w-full border rounded-lg px-3 py-2" /></div>
        <label class="flex items-center gap-2 text-sm"><input name="activo" type="checkbox" ${service?.activo !== false ? "checked" : ""} />Activo</label>
      `, "Guardar", async form => {
        const nombre = form.elements.nombre.value.trim();
        if (!nombre) return;
        const previous = db.services || [];
        const updated = { id: service?.id || uid("service"), nombre, precioSugerido: form.elements.precio.value === "" ? null : Number(form.elements.precio.value), costoSugerido: form.elements.costo.value === "" ? null : Number(form.elements.costo.value), activo: form.elements.activo.checked };
        db.services = service ? previous.map(entry => entry.id === service.id ? updated : entry) : [...previous, updated];
        if (!await saveDB()) { db.services = previous; return; }
        cerrarModal();
        showToast("Servicio guardado", "success");
      });
    }

    function showServiceSaleModal(serviceId, cartIndex = null) {
      const service = (db.services || []).find(entry => entry.id === serviceId && entry.activo !== false);
      const item = cartIndex == null ? null : appState.cart[cartIndex];
      if (!service && !item) return;
      showServiceForm(item?.nombre || service.nombre, `
        <div><label for="serviceSalePrice" class="block text-sm font-semibold mb-1">Precio acordado</label><input id="serviceSalePrice" name="precio" type="number" min="0.01" max="9999999999.99" step="0.01" value="${item?.precio ?? service?.precioSugerido ?? ""}" required class="w-full border rounded-lg px-3 py-2" /></div>
        <div><label for="serviceSaleCost" class="block text-sm font-semibold mb-1">Costo directo (opcional)</label><input id="serviceSaleCost" name="costo" type="number" min="0" max="9999999999.99" step="0.01" value="${item ? item.costo ?? "" : service?.costoSugerido ?? ""}" class="w-full border rounded-lg px-3 py-2" /></div>
        <div><label for="serviceSaleNotes" class="block text-sm font-semibold mb-1">Observaciones</label><textarea id="serviceSaleNotes" name="observaciones" maxlength="500" rows="3" class="w-full border rounded-lg px-3 py-2">${escapeHtml(item?.observaciones)}</textarea></div>
      `, item ? "Actualizar" : "Agregar al carrito", form => {
        const entry = { tipo: "servicio", serviceId: item?.serviceId || service.id, nombre: item?.nombre || service.nombre, cantidad: item?.cantidad || 1, precio: Number(form.elements.precio.value), costo: form.elements.costo.value === "" ? null : Number(form.elements.costo.value), observaciones: form.elements.observaciones.value.trim() };
        if (cartIndex == null) appState.cart.push(entry);
        else appState.cart[cartIndex] = entry;
        cerrarModal();
      });
    }

    function onPosServiceSelected(serviceId) {
      appState.selectedPosServiceId = serviceId;
      const service = (db.services || []).find(entry => entry.id === serviceId && entry.activo !== false);
      const priceInput = document.getElementById("posServicePrice");
      const costInput = document.getElementById("posServiceCost");
      if (priceInput) priceInput.value = service?.precioSugerido ?? "";
      if (costInput) costInput.value = service?.costoSugerido ?? "";
    }

    function addSelectedServiceToCart() {
      const service = (db.services || []).find(entry => entry.id === appState.selectedPosServiceId && entry.activo !== false);
      const priceInput = document.getElementById("posServicePrice");
      const costInput = document.getElementById("posServiceCost");
      const notesInput = document.getElementById("posServiceNotes");
      const precio = Number(priceInput?.value);
      const costo = costInput?.value === "" ? null : Number(costInput?.value);
      if (!service) return showToast("Selecciona un servicio", "warning");
      if (!Number.isFinite(precio) || precio <= 0) return showToast("Ingresa un precio mayor que cero", "warning");
      if (costo != null && (!Number.isFinite(costo) || costo < 0)) return showToast("Ingresa un costo válido", "warning");
      appState.cart.push({ tipo: "servicio", serviceId: service.id, nombre: service.nombre, cantidad: 1, precio, costo, observaciones: notesInput?.value.trim() || "" });
