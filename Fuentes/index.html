<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="0; url=./sistema-completo.html" />
    <title>Mujer Magica - Sistema integrado</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #fff7ed, #ecfeff 50%, #eff6ff);
        color: #0f172a;
      }
      .card {
        max-width: 560px;
        width: calc(100% - 32px);
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(226, 232, 240, 0.9);
        border-radius: 24px;
        padding: 28px;
        box-shadow: 0 20px 60px rgba(15, 23, 42, 0.12);
      }
      a {
        display: inline-block;
        margin-top: 16px;
        padding: 12px 18px;
        border-radius: 14px;
        background: #0f172a;
        color: white;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 style="margin:0 0 10px 0; font-size:28px;">Mujer Magica</h1>
      <p style="margin:0; line-height:1.5;">Abriendo el sistema integrado en <strong>sistema-completo.html</strong>. Si el salto automático no ocurre, usa el enlace de abajo.</p>
      <a href="./sistema-completo.html">Abrir sistema completo</a>
    </div>
    <script>
      window.location.replace("./sistema-completo.html");
    </script>
  </body>
